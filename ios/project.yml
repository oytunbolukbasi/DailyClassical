name: DailyClassical
options:
  bundleIdPrefix: co.dailyclassical
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 3NX95JSKNY
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  DailyClassical:
    type: application
    platform: iOS
    sources:
      - path: DailyClassical
        excludes:
          - Resources/Fixtures
      # Folder reference keeps Fixtures/<locale>/ subdirectories in the bundle.
      - path: DailyClassical/Resources/Fixtures
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.dailyclassical.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DailyClassical
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          API_BASE_URL: "http:/$()/Oytuns-MacBook-Pro.local:3100"
        Release:
          API_BASE_URL: "https:/$()/api.dailyclassical.co"
    info:
      path: DailyClassical/Info.plist
      properties:
        API_BASE_URL: $(API_BASE_URL)
        CFBundleLocalizations: [en, tr]
        UIAppFonts: [Literata-Regular.ttf, Literata-Medium.ttf, Literata-SemiBold.ttf, Literata-Italic.ttf, Literata-MediumItalic.ttf]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: "Debug builds connect to the development server on this network."
  DailyClassicalTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DailyClassicalTests]
    dependencies:
      - target: DailyClassical
schemes:
  DailyClassical:
    build:
      targets:
        DailyClassical: all
    run:
      storeKitConfiguration: DailyClassical/Resources/DailyClassical.storekit
    test:
      targets: [DailyClassicalTests]
