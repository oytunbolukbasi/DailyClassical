name: DailyClassical
options:
  bundleIdPrefix: co.dailyclassical
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 3NX95JSKNY
    CODE_SIGN_STYLE: Automatic
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
  # Read by the app (APIClient) and the widget (its own feed, GET /v1/widget). Debug builds talk to
  # production too (sign-in, favourites; content only with DC_USE_API=1). For a local server, build
  # with API_BASE_URL=http://localhost:3101 (simulator) on the xcodebuild command line.
  configs:
    Debug:
      API_BASE_URL: "https:/$()/api.dailyclassical.co"
    Release:
      API_BASE_URL: "https:/$()/api.dailyclassical.co"
packages:
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm.git
    from: 5.93.0
targets:
  DailyClassical:
    type: application
    platform: iOS
    sources:
      - path: DailyClassical
        excludes:
          - Resources/Fixtures
          - Resources/Artwork
      # Folder reference keeps Fixtures/<locale>/ subdirectories in the bundle.
      - path: DailyClassical/Resources/Fixtures
        type: folder
        buildPhase: resources
      # Optimized painting/portrait JPEGs + manifest.json (`npm run images` in backend/), read by ImagePipeline.
      - path: DailyClassical/Resources/Artwork
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.dailyclassical.app
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DailyClassical
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: DailyClassical/DailyClassical.entitlements
        # RevenueCat's *public* Apple SDK key (appl_…), safe to ship in the app. Empty = purchases go
        # straight through StoreKit 2 (local StoreKit configuration file); see EntitlementStore.
        REVENUECAT_API_KEY: appl_oyvZmpSeMAqWXZgCzcMxRyRiQDo
    info:
      path: DailyClassical/Info.plist
      properties:
        API_BASE_URL: $(API_BASE_URL)
        REVENUECAT_API_KEY: $(REVENUECAT_API_KEY)
        CFBundleLocalizations: [en, tr]
        UIAppFonts: [Literata-Regular.ttf, Literata-Medium.ttf, Literata-SemiBold.ttf, Literata-Italic.ttf, Literata-MediumItalic.ttf]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Translated in Resources/InfoPlist.xcstrings (from strings/infoplist.json; build-strings.py),
        # which the DailyClassical source folder adds to the app's resources.
        NSLocalNetworkUsageDescription: "Debug builds connect to the development server on this network."
        NSPhotoLibraryAddUsageDescription: "Saves the painting you choose as a wallpaper to your photos."
        # Widget taps open dailyclassical://piece/<id>
        CFBundleURLTypes:
          - CFBundleURLName: co.dailyclassical.app
            CFBundleURLSchemes: [dailyclassical]
    dependencies:
      - target: DailyClassicalWidget
        embed: true
      - package: RevenueCat
  # Home Screen widgets (small / medium / large). Fetches its own feed (GET /v1/widget) so pieces
  # published after the app shipped appear; falls back to its cached feed, then to the bundled
  # fixtures and artwork, so it always works offline. The language comes from the shared App Group.
  DailyClassicalWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: DailyClassicalWidget
        excludes:
          - Artwork
      - path: DailyClassical/DesignSystem/Palette.swift
      - path: DailyClassical/Resources/Localizable.xcstrings
      - path: DailyClassical/Resources/Fonts
      - path: DailyClassical/Resources/Fixtures
        type: folder
        buildPhase: resources
      # Widget-only JPEGs (npm run images:widget), not the app's 11 MB HEIC Artwork folder.
      - path: DailyClassicalWidget/Artwork
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.dailyclassical.app.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: DailyClassical
        CODE_SIGN_ENTITLEMENTS: DailyClassicalWidget/DailyClassicalWidget.entitlements
        # WidgetKit's protocols are nonisolated; the widget has no UI state of its own.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        SKIP_INSTALL: YES
    info:
      path: DailyClassicalWidget/Info.plist
      properties:
        API_BASE_URL: $(API_BASE_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleLocalizations: [en, tr]
        UIAppFonts: [Literata-Regular.ttf, Literata-Medium.ttf, Literata-SemiBold.ttf, Literata-Italic.ttf, Literata-MediumItalic.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  DailyClassicalTests:
    type: bundle.unit-test
    platform: iOS
    sources: [DailyClassicalTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: co.dailyclassical.app.tests
    dependencies:
      - target: DailyClassical
schemes:
  DailyClassical:
    build:
      targets:
        DailyClassical: all
    run:
      storeKitConfiguration: DailyClassical/Resources/DailyClassical.storekit
    test:
      targets: [DailyClassicalTests]
