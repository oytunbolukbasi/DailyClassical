# Painting image assets, keyed by piece id (same ids as the yaml blocks in content/<locale>/pieces/<id>.md).
# Titles, years, collections and pairing notes stay in the markdown (they are translated);
# this file holds the language-neutral image facts, read by backend/scripts/seed.ts and
# backend/scripts/export-fixtures.ts.
#
# Fields
#   image_url     Direct image URL. Wikimedia Commons Special:FilePath links resolve to the original
#                 file; download it and serve our own CDN copy before launch. null = no usable image yet.
#   source_url    The holding museum's object page.
#   commons_page  The Wikimedia Commons file page (licence template, file history).
#   width/height  Pixel size of the original Commons file (null when the research did not record it).
#   medium        Medium as given by the museum.
#   license       Licence of the image file (not of the artwork; all artworks here are public domain
#                 by age, with the Malevich caveat noted in its rights_flag).
#   credit_line   Text to show wherever the image is credited.
#   rights_status public_domain | unverified | restricted (paintings.rights_status in the DB).
#   hero / thumb / full  Written by `npm run images` (backend/): pixel size + bytes of our optimized HEIC
#                 copies (backend/public/images/paintings/<id>-hero|thumb|full.heic, served at /images;
#                 hero + thumb are bundled in the app, full is the artwork viewer's zoom copy, downloaded on demand).
#                 After changing one image_url: `npm run images -- --only <id>` then `npm run fixtures`.
#   placeholder_color  Average colour of the image (also by `npm run images`), shown while it loads.
#
# Source: content/research/verification-1-5.md and verification-6-10.md (checked 2026-10-04).
# NC-licensed images (e.g. the Staatliche Museen zu Berlin's own CC BY-NC-SA photos) are deliberately not used.

