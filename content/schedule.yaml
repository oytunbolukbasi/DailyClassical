# Which piece is "Today". Day 0 is `start`; the order repeats until new pieces are added.
# db:seed writes the next `days` dates into daily_schedule; fixtures carry the same plan for the app.
# A piece is published on its latest scheduled day up to the reader's today; the Library lists only
# published pieces and Today pages back through past days.
#
# Launch: the app went live on 9 Nov 2026, day 0, with Tchaikovsky 6. Days 0–13 are the fourteen
# pieces that shipped in the review build, days 14–20 the first week of the October batches; from
# then on about seven pieces a week are appended (project-knowledge/content_status.md › Yayın planı).
# Append only: moving or removing a piece changes which piece earlier days showed.
start: 2026-11-09
days: 365
order:
  # Days 0–13 (9–22 Nov)
  - tchaikovsky-symphony-6
  - mozart-symphony-40
  - beethoven-piano-sonata-8
  - beethoven-symphony-5
  - dvorak-symphony-9
  - schubert-symphony-8
  - brahms-symphony-4
  - mozart-piano-concerto-23
  - berlioz-symphonie-fantastique
  - beethoven-symphony-9
  - beethoven-piano-concerto-3
  - mahler-symphony-5
  - shostakovich-symphony-5
  - rachmaninoff-piano-concerto-2
  # Days 14–20 (23–29 Nov)
  - beethoven-symphony-3
  - vivaldi-four-seasons-spring
  - beethoven-piano-sonata-14
  - dvorak-cello-concerto
  - ravel-bolero
  - mozart-symphony-41
  - chopin-piano-concerto-1
