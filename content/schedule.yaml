# Which piece is "Today". Day 0 is `start`; the order repeats until new pieces are added.
# db:seed writes the next `days` dates into daily_schedule; fixtures carry the same plan for the app.
# A piece is published on its latest scheduled day up to the reader's today; the Library lists only
# published pieces and Today pages back through past days.
#
# TEST DATA (content review): `start` is 2026-09-24 so all fourteen pieces are published by 7 Oct and
# show in the Library, with Rachmaninoff 2 (last in the order) as Today on 7 Oct. Before release,
# set `start` to the launch day with tchaikovsky-symphony-6 first, then re-run db:seed and
# `npm run fixtures`.
start: 2026-09-24
days: 365
order:
  - mozart-symphony-40
  - beethoven-piano-sonata-8
  - beethoven-symphony-5
  - dvorak-symphony-9
  - schubert-symphony-8
  - brahms-symphony-4
  - mozart-piano-concerto-23
  - berlioz-symphonie-fantastique
  - beethoven-symphony-9
  - beethoven-piano-concerto-3
  - mahler-symphony-5
  - shostakovich-symphony-5
  - tchaikovsky-symphony-6
  - rachmaninoff-piano-concerto-2
