  commons_page: https://commons.wikimedia.org/wiki/File:Caspar_David_Friedrich_-_Wanderer_above_the_sea_of_fog.jpg
  width: 2327
  height: 2980
  medium: Oil on canvas
  license: Public domain (PD-Art)
  credit_line: Caspar David Friedrich, Wanderer above the Sea of Fog, c. 1818. Hamburger Kunsthalle. Image via Wikimedia Commons, public domain.
  rights_status: public_domain
  hero: { width: 1800, height: 2305, bytes: 557080 }
  thumb: { width: 300, height: 384, bytes: 14223 }
  placeholder_color: "#848792"

