# Images the app shows outside pieces and composers, keyed `<kind>/<id>` (the manifest key and
# the file path: backend/public/images/<kind>/<id>-hero|thumb.heic). Same pipeline and fields as
# paintings.yaml, but only hero + thumb are made (no zoom copy) and both are bundled in the app.
# The app finds the bundled copy by `image_url` (ImagePipeline matches the manifest `source`),
# so the URL in the app must stay equal to `image_url` here.
# After changing one: `npm run images -- --only <kind>/<id>` (backend/).
#
# Captions and credits live in the app strings (e.g. `paywall.painting.caption`).

paywall/friedrich-wanderer:
