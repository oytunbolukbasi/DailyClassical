- id: barber
  match: Samuel Barber
  sort_name: Barber, Samuel
  born: 1910
  birthday: "03-09"
  birthday_basis: null
  birthday_note:
    en: "The *Adagio for Strings* began as the slow movement of a string quartet, written in 1936 when Barber was 26. Two years later Toscanini conducted it on the radio, and it has hardly been silent since."
    tr: "*Yaylılar için Adagio*, Barber’ın 1936’da, 26 yaşında yazdığı bir yaylı dörtlünün ağır bölümü olarak doğdu. İki yıl sonra Toscanini onu radyoda yönetti; o günden beri pek susmadı."
  birthday_line:
    en: "Born on this day in 1910, in West Chester."
    tr: "1910’da bugün West Chester’da doğdu."
  died: 1981
  era: modern
  names:
    en: { name: Samuel Barber, short: Barber }
    tr: { name: Samuel Barber, short: Barber, short_genitive: Barber’ın }
  nationality: { en: American, tr: Amerikalı }
  facts:
    born: { en: "9 March 1910, West Chester, Pennsylvania", tr: "9 Mart 1910, West Chester, Pensilvanya" }
    died: { en: "23 January 1981, New York", tr: "23 Ocak 1981, New York" }
    symphonies: { en: "Two (he later suppressed the Second)", tr: "İki (İkinci’yi sonradan geri çekti)" }
    best_known_for: { en: "*Adagio for Strings*, *Knoxville: Summer of 1915*, the opera *Vanessa*", tr: "*Yaylılar için Adagio*, *Knoxville: 1915 Yazı*, *Vanessa* operası" }
  bio:
    en: |-
      Barber was born in 1910 in West Chester, Pennsylvania, the son of a doctor. Music ran in the family: his aunt, Louise Homer, was a leading contralto at the Metropolitan Opera, and her husband, the songwriter Sidney Homer, guided him for more than twenty-five years. He wrote his first piece at seven, and at nine left his mother a note: he was not meant to be an athlete but a composer. At fourteen he entered the new Curtis Institute of Music in Philadelphia, where he studied composition, piano and singing, and where in 1928 he met the Italian composer Gian Carlo Menotti, his partner for more than forty years.

      Success came early. For a while he also sang professionally as a baritone, on NBC radio. A Rome Prize took him to Italy, where he wrote his Symphony in One Movement, and in 1938 Arturo Toscanini conducted his *Adagio for Strings* on the radio, making him famous. His music stayed lyrical and largely tonal while much modern music turned away from melody. He served in the Army Air Corps during the Second World War, and from 1943 he and Menotti lived at Capricorn, a house north of New York, where he wrote much of his best music, including *Knoxville: Summer of 1915* for soprano and orchestra.

      He won the Pulitzer Prize twice, for his opera *Vanessa* (1958) and for his Piano Concerto, written for the opening of Lincoln Center in New York. His opera *Antony and Cleopatra*, which opened the new Metropolitan Opera House in 1966, was poorly received, and in his last years he struggled with depression and drinking and wrote less. He died of cancer in New York on 23 January 1981, aged 70, and was buried in his home town of West Chester.
    tr: |-
      Barber 1910’da Pensilvanya’nın West Chester kasabasında, bir doktorun oğlu olarak doğdu. Müzik ailede vardı: teyzesi Louise Homer, Metropolitan Operası’nın önde gelen kontraltolarındandı; onun eşi şarkı bestecisi Sidney Homer da yirmi beş yılı aşkın bir süre ona yol gösterdi. İlk parçasını yedi yaşında yazdı; dokuz yaşında annesine bıraktığı bir notta sporcu olmak için değil, besteci olmak için doğduğunu yazdı. On dört yaşında Philadelphia’daki yeni Curtis Müzik Enstitüsü’ne girdi; kompozisyon, piyano ve şan okudu. 1928’de orada, kırk yılı aşkın hayat arkadaşı olacak İtalyan besteci Gian Carlo Menotti ile tanıştı.

      Başarı erken geldi. Bir süre NBC radyosunda profesyonel bariton olarak da şarkı söyledi. Roma Ödülü onu İtalya’ya götürdü; orada *Tek Bölümlük Senfoni*’sini yazdı. 1938’de Arturo Toscanini’nin radyoda yönettiği *Yaylılar için Adagio* onu ünlü yaptı. Modern müziğin büyük bölümü melodiden uzaklaşırken onun müziği lirik ve büyük ölçüde tonal kaldı. İkinci Dünya Savaşı’nda Ordu Hava Kuvvetleri’nde görev yaptı; 1943’ten itibaren Menotti ile New York’un kuzeyindeki Capricorn adlı evde yaşadı ve en iyi eserlerinin çoğunu, soprano ve orkestra için *Knoxville: 1915 Yazı* da dahil, orada yazdı.

      Pulitzer Ödülü’nü iki kez kazandı: *Vanessa* operası (1958) ve New York’taki Lincoln Center’ın açılışı için yazdığı Piyano Konçertosu ile. Yeni Metropolitan Opera binasını 1966’da açan *Antonius ve Kleopatra* operası kötü karşılandı; son yıllarında depresyon ve alkolle boğuştu, daha az yazdı. 23 Ocak 1981’de, 70 yaşında New York’ta kanserden öldü ve doğduğu kasaba West Chester’da toprağa verildi.
