- id: dukas
  match: Paul Dukas
  sort_name: Dukas, Paul
  born: 1865
  birthday: "10-01"
  birthday_basis: null
  birthday_note:
    en: "Dukas was so hard on his own music that he destroyed many of his manuscripts. *The Sorcerer’s Apprentice* survived, and became so popular that it came to irritate him."
    tr: "Dukas kendi müziğine o kadar acımasızdı ki birçok el yazmasını yok etti. *Büyücünün Çırağı* kurtuldu ve öyle sevildi ki zamanla onu sinirlendirmeye başladı."
  birthday_line:
    en: "Born on this day in 1865, in Paris."
    tr: "1865’te bugün Paris’te doğdu."
  died: 1935
  era: late_romantic
  names:
    en: { name: Paul Dukas, short: Dukas }
    tr: { name: Paul Dukas, short: Dukas, short_genitive: Dukas’ın }
  nationality: { en: French, tr: Fransız }
  facts:
    born: { en: "1 October 1865, Paris", tr: "1 Ekim 1865, Paris" }
    died: { en: "17 May 1935, Paris", tr: "17 Mayıs 1935, Paris" }
    symphonies: { en: "One, in C major", tr: "Bir, Do majör" }
    best_known_for: { en: "*The Sorcerer’s Apprentice*, *Ariane et Barbe-bleue*, *La Péri*", tr: "*Büyücünün Çırağı*, *Ariane et Barbe-bleue*, *La Péri*" }
  bio:
    en: |-
      Dukas was born in Paris in 1865 into a Jewish family. His father was a banker; his mother, a pianist, died when he was five. He entered the Paris Conservatoire at the end of 1881 and studied composition with Ernest Guiraud; Claude Debussy, a fellow student, became a close friend. In 1888 he came second in the Prix de Rome with his cantata *Velléda*, and the next year he left the Conservatoire.

      From 1892 he earned a name as a music critic, writing regularly for at least five French journals, and with Camille Saint-Saëns he worked on a new edition of the music of Rameau. His own works appeared slowly: the overture *Polyeucte* (1891), a Symphony in C (1895–96) and, in 1897, the [[scherzo]] *The Sorcerer’s Apprentice*, after a ballad by Goethe. It became so popular that it overshadowed everything else he wrote, which irritated him. His opera *Ariane et Barbe-bleue*, on a text by Maurice Maeterlinck, was staged at the Opéra-Comique in 1907, and the ballet *La Péri* followed in 1912.

      *La Péri* was his last large work. Dukas was fiercely self-critical and destroyed many of his compositions; after 1912 he finished only a few short pieces, among them a tribute to Debussy in 1920. He became an influential teacher instead: from 1927 he taught composition at the Conservatoire and at the École Normale de Musique, and his pupils included Olivier Messiaen, Maurice Duruflé and Joaquín Rodrigo. He was elected to the Académie des Beaux-Arts in 1934 and died in Paris on 17 May 1935, aged 69.
    tr: |-
      Dukas 1865’te Paris’te, Yahudi bir ailede doğdu. Babası bankacıydı; piyanist olan annesi o beş yaşındayken öldü. 1881’in sonunda Paris Konservatuvarı’na girdi ve Ernest Guiraud ile kompozisyon çalıştı; okul arkadaşı Claude Debussy yakın dostu oldu. 1888’de *Velléda* kantatıyla Roma Ödülü’nde ikinci oldu, ertesi yıl da Konservatuvar’dan ayrıldı.

      1892’den itibaren müzik eleştirmeni olarak ün kazandı; en az beş Fransız dergisine düzenli yazdı ve Camille Saint-Saëns ile birlikte Rameau’nun eserlerinin yeni bir basımı üzerinde çalıştı. Kendi eserleri ağır ağır geldi: *Polyeucte* uvertürü (1891), Do majör Senfoni (1895–96) ve 1897’de, Goethe’nin bir baladına dayanan [[scherzo|scherzo]] *Büyücünün Çırağı*. Bu eser öyle sevildi ki yazdığı her şeyi gölgede bıraktı; bu da onu sinirlendirdi. Maurice Maeterlinck’in metni üzerine yazdığı *Ariane et Barbe-bleue* operası 1907’de Opéra-Comique’te sahnelendi, *La Péri* balesi de 1912’de geldi.

      *La Péri* son büyük eseri oldu. Dukas kendine karşı son derece acımasızdı ve bestelerinin birçoğunu yok etti; 1912’den sonra yalnızca birkaç kısa parça tamamladı, aralarında 1920’de Debussy’ye yazdığı bir saygı duruşu da vardı. Bunun yerine etkili bir öğretmen oldu: 1927’den itibaren Konservatuvar’da ve École Normale de Musique’te kompozisyon okuttu; öğrencileri arasında Olivier Messiaen, Maurice Duruflé ve Joaquín Rodrigo vardı. 1934’te Académie des Beaux-Arts’a seçildi ve 17 Mayıs 1935’te, 69 yaşında Paris’te öldü.
