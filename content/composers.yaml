- id: berlioz
  match: Hector Berlioz
  sort_name: Berlioz, Hector
  born: 1803
  died: 1869
  era: romantic
  names:
    en: { name: Hector Berlioz, short: Berlioz }
    tr: { name: Hector Berlioz, short: Berlioz }
  nationality: { en: French, tr: Fransız }
  facts:
    born: { en: "11 December 1803, La Côte-Saint-André", tr: "11 Aralık 1803, La Côte-Saint-André" }
    died: { en: "8 March 1869, Paris", tr: "8 Mart 1869, Paris" }
    symphonies: { en: "Four, starting with the *Fantastique*", tr: "Dört; ilki *Fantastik*" }
    best_known_for: { en: "*Symphonie fantastique*, *Les Troyens*", tr: "*Fantastik Senfoni*, *Truvalılar*" }
  bio:
    en: |-
      Berlioz was born in 1803 in La Côte-Saint-André, a small town near Grenoble, where his father was a doctor. He was sent to Paris to study medicine, but he hated the dissecting room and spent his evenings at the opera instead. Against his family's wishes he gave up medicine for music and entered the Paris Conservatoire. Unusually for a composer, he never became a real pianist; his instruments were the flute and the guitar.

      In 1827 he saw the Irish actress Harriet Smithson play Ophelia and Juliet, and fell obsessively in love with her. That passion poured into the *Symphonie fantastique* of 1830, a piece of [[programme music]] about an artist's love, his opium dreams and a nightmarish witches' sabbath, with the beloved represented by a returning melody, the [[idée fixe]]. He did eventually meet and marry Harriet, but the marriage was unhappy.

      Berlioz thought in sound and colour, and his book on orchestration was studied by composers for generations. In France he was often misunderstood and made much of his living as a music critic, while audiences in Germany, Russia and England welcomed him as a conductor. His epic opera *Les Troyens* was never staged complete in his lifetime. He died in Paris in 1869.
    tr: |-
      Berlioz 1803’te, Grenoble yakınlarındaki küçük bir kasaba olan La Côte-Saint-André’da doğdu; babası doktordu. Tıp okumak için Paris’e gönderildi, ama kadavra salonundan nefret etti ve akşamlarını operada geçirdi. Ailesinin karşı çıkmasına rağmen tıbbı bırakıp müziğe yöneldi ve Paris Konservatuvarı’na girdi. Bir besteci için alışılmadık biçimde hiçbir zaman gerçek bir piyanist olmadı; çaldığı çalgılar flüt ve gitardı.

      1827’de İrlandalı oyuncu Harriet Smithson’ı Ophelia ve Juliet rollerinde izledi ve ona takıntılı bir aşkla bağlandı. Bu tutku, 1830 tarihli *Fantastik Senfoni*’ye aktı: Bir sanatçının aşkını, afyonla gelen düşlerini ve kâbus gibi bir cadılar sabbatını anlatan bir [[programme music|programlı müzik]] eseri. Sevgili, eser boyunca geri dönen bir melodiyle, bir [[idée fixe|idée fixe]] ile temsil edilir. Berlioz sonunda Harriet’le tanışıp evlendi, ama evlilikleri mutsuz geçti.

      Berlioz sesle ve renkle düşünürdü; orkestrasyon üzerine yazdığı kitap kuşaklar boyunca bestecilere yol gösterdi. Fransa’da çoğu zaman anlaşılmadı ve geçimini büyük ölçüde müzik eleştirmenliğiyle sağladı; Almanya, Rusya ve İngiltere’deki dinleyiciler ise onu orkestra şefi olarak bağırlarına bastı. Destansı operası *Truvalılar* (*Les Troyens*) hayattayken hiçbir zaman eksiksiz sahnelenmedi. 1869’da Paris’te öldü.
