- id: vaughan-williams
  match: Ralph Vaughan Williams
  sort_name: Vaughan Williams, Ralph
  born: 1872
  birthday: "10-12"
  birthday_basis: null
  birthday_note:
    en: "In 1914, the year of *The Lark Ascending*, Vaughan Williams was at Margate and later told how a Boy Scout made a citizen’s arrest, taking the jottings in a notebook for maps for the enemy."
    tr: "Vaughan Williams, *Yükselen Tarlakuşu*’nu yazdığı 1914 yılında Margate’teydi. Sonradan anlattığına göre bir izci, defterdeki notları düşmana gidecek haritalar sanıp besteciyi “tutuklamıştı”."
  birthday_line:
    en: "Born on this day in 1872, in Down Ampney."
    tr: "1872’de bugün Down Ampney’de doğdu."
  died: 1958
  era: modern
  names:
    en: { name: Ralph Vaughan Williams, short: Vaughan Williams }
    tr: { name: Ralph Vaughan Williams, short: Vaughan Williams, short_genitive: Vaughan Williams’ın }
  nationality: { en: English, tr: İngiliz }
  facts:
    born: { en: "12 October 1872, Down Ampney, Gloucestershire", tr: "12 Ekim 1872, Down Ampney, Gloucestershire" }
    died: { en: "26 August 1958, London", tr: "26 Ağustos 1958, Londra" }
    symphonies: { en: "Nine", tr: "Dokuz" }
    best_known_for: { en: "*The Lark Ascending*, *Fantasia on a Theme by Thomas Tallis*, nine symphonies", tr: "*Yükselen Tarlakuşu*, *Thomas Tallis’in Bir Teması Üzerine Fantezi*, dokuz senfoni" }
  bio:
    en: |-
      Vaughan Williams was born in 1872 at Down Ampney in Gloucestershire, where his father was the vicar. His father died when he was two, and the family moved to his mother's family home in Surrey; she was a great-granddaughter of the potter Josiah Wedgwood and a niece of Charles Darwin. He began piano lessons at five but much preferred the violin. He studied at the Royal College of Music with Hubert Parry and at Cambridge, and was a late developer: he found his own voice only in his late thirties.

      From 1903 he travelled the English countryside collecting folk songs from village singers, and their old modes shaped his music for the rest of his life, together with his love of Tudor church music. In the winter of 1907–08 he spent three months in Paris studying with Maurice Ravel, who said he was "my only pupil who does not write my music". Two premieres in 1910 made his name: the *Fantasia on a Theme by Thomas Tallis* in Gloucester Cathedral and *A Sea Symphony* in Leeds.

      When war came in 1914 he volunteered, aged nearly 42, and served as a stretcher-bearer in France and Greece and later as an artillery officer; the guns damaged his hearing. He went on to teach at the Royal College of Music, and wrote nine symphonies over almost half a century, the last first heard four months before his death. After the death of his first wife, Adeline, he married the poet Ursula Wood in 1953. He died in London on 26 August 1958, aged 85, and his ashes lie in Westminster Abbey, near Henry Purcell.
    tr: |-
      Vaughan Williams 1872’de, babasının papaz olduğu Gloucestershire’daki Down Ampney’de doğdu. Babası o iki yaşındayken öldü ve aile, annesinin Surrey’deki aile evine taşındı; annesi çömlekçi Josiah Wedgwood’un torununun kızı ve Charles Darwin’in yeğeniydi. Beş yaşında piyano derslerine başladı ama kemanı çok daha çok sevdi. Kraliyet Müzik Koleji’nde Hubert Parry ile ve Cambridge’de okudu; geç gelişen bir besteciydi, kendi sesini ancak otuzlarının sonunda buldu.

      1903’ten itibaren İngiliz kırsalını dolaşıp köylerdeki halk şarkıcılarından türküler derledi; bu şarkıların eski modları, Tudor dönemi kilise müziğine duyduğu sevgiyle birlikte, müziğini ömrünün sonuna dek biçimlendirdi. 1907–08 kışında Paris’te üç ay Maurice Ravel ile çalıştı; Ravel onun için “benim müziğimi yazmayan tek öğrencim” dedi. 1910’daki iki ilk seslendirme adını duyurdu: Gloucester Katedrali’nde *Thomas Tallis’in Bir Teması Üzerine Fantezi* ve Leeds’te *Deniz Senfonisi*.

      1914’te savaş çıkınca 42 yaşına girmek üzereyken gönüllü oldu; Fransa’da ve Yunanistan’da sedyeci, sonra da topçu subayı olarak görev yaptı; top sesleri işitmesine zarar verdi. Ardından Kraliyet Müzik Koleji’nde ders verdi ve neredeyse yarım yüzyıla yayılan dokuz senfoni yazdı; sonuncusu ölümünden dört ay önce ilk kez seslendirildi. İlk eşi Adeline’in ölümünden sonra, 1953’te şair Ursula Wood ile evlendi. 26 Ağustos 1958’de, 85 yaşında Londra’da öldü; külleri Westminster Abbey’de, Henry Purcell’in yakınında yatıyor.
