- id: faure
  match: Gabriel Fauré
  sort_name: Fauré, Gabriel
  born: 1845
  birthday: "05-12"
  birthday_basis: null
  birthday_note:
    en: "As a small boy in the south of France, Fauré slipped away to play the harmonium in a school chapel whenever he could. An old blind woman who came to listen told his father that the boy had a gift."
    tr: "Fauré küçük bir çocukken, Fransa’nın güneyinde, fırsat buldukça bir okul şapelindeki harmoniyuma kaçardı. Onu dinlemeye gelen yaşlı, kör bir kadın babasına oğlunun yetenekli olduğunu söyledi."
  birthday_line:
    en: "Born on this day in 1845, in Pamiers."
    tr: "1845’te bugün Pamiers’de doğdu."
  died: 1924
  era: late_romantic
  names:
    en: { name: Gabriel Fauré, short: Fauré }
    tr: { name: Gabriel Fauré, short: Fauré, short_genitive: Fauré’nin }
  nationality: { en: French, tr: Fransız }
  facts:
    born: { en: "12 May 1845, Pamiers", tr: "12 Mayıs 1845, Pamiers" }
    died: { en: "4 November 1924, Paris", tr: "4 Kasım 1924, Paris" }
    symphonies: { en: "None published", tr: "Yayımlanmış senfonisi yok" }
    best_known_for: { en: "*Requiem*, *Pavane*, songs", tr: "*Requiem*, *Pavane*, şarkıları" }
  bio:
    en: |-
      Fauré was born in 1845 in Pamiers, in the foothills of the Pyrenees, the youngest of six children of a schoolmaster. He was the only one of them with a gift for music, and he found it on the harmonium of the chapel at his father's teacher-training college. At nine he was sent to Paris, to the École Niedermeyer, a boarding school that trained church organists and choirmasters. There, from 1861, his piano teacher was Camille Saint-Saëns, who showed his pupils the music of Schumann, Liszt and Wagner and became Fauré's friend for life. Fauré left in 1865 with a prize for his *Cantique de Jean Racine*.

      For decades he earned his living at the organ and by teaching. His first post, in Rennes, ended when he arrived to play at Mass one Sunday still in evening clothes after a ball. After serving in the Franco-Prussian War he helped to found the Société nationale de musique in 1871, and in 1877 he became choirmaster of the Madeleine in Paris, where he later became chief organist. His publisher bought his songs outright for small sums, and composition had to wait for the summer holidays. Yet these years produced the songs that made him a master of the French mélodie, among them *Après un rêve* and *Clair de lune*, the *Pavane* and the [[requiem|Requiem]]. In 1896 he became professor of composition at the Paris Conservatoire, where his pupils included Ravel and Nadia Boulanger.

      In 1905 he was made director of the Conservatoire, and he modernised it so firmly that the old guard called him "Robespierre". From around this time he was slowly going deaf, and high and low notes reached him painfully out of tune. He still wrote some of his finest music, the opera *Pénélope* (1913), late songs, piano pieces and chamber music, much of it composed in hotels by the Swiss lakes. He retired in 1920, was honoured with a national tribute in 1922, and finished his only string quartet in September 1924. He died in Paris on 4 November 1924, aged 79, and was given a state funeral at the Madeleine. Aaron Copland called him "the Brahms of France".
    tr: |-
      Fauré 1845’te Pirene eteklerindeki Pamiers’de, bir öğretmenin altı çocuğunun en küçüğü olarak doğdu. Çocuklar arasında müzik yeteneği olan tek kişi oydu ve bunu babasının yönettiği öğretmen okulunun şapelindeki harmoniyumda keşfetti. Dokuz yaşında Paris’e, kilise orgcusu ve koro şefi yetiştiren yatılı bir okul olan École Niedermeyer’e gönderildi. Orada 1861’den itibaren piyano öğretmeni Camille Saint-Saëns’dı; Saint-Saëns öğrencilerine Schumann’ı, Liszt’i ve Wagner’i tanıttı ve Fauré’nin ömür boyu dostu oldu. Fauré okuldan 1865’te, *Cantique de Jean Racine* ile kazandığı bir ödülle ayrıldı.

      Onlarca yıl geçimini org çalarak ve ders vererek sağladı. Rennes’deki ilk görevi, bir pazar günü ayine bir balodan çıkıp gece kıyafetiyle gelince sona erdi. Fransa-Prusya Savaşı’nda askerlik yaptıktan sonra 1871’de Société nationale de musique’in kurucuları arasında yer aldı; 1877’de Paris’teki La Madeleine Kilisesi’nin koro şefi oldu, sonradan baş orgcusu da olacaktı. Yayıncısı şarkılarını küçük paralara bir kerede satın alıyordu; beste yapmak yaz tatillerini bekliyordu. Yine de bu yıllar onu Fransız mélodie’sinin ustası yapan şarkıları, aralarında *Après un rêve* ve *Clair de lune*’ü, *Pavane*’ı ve [[requiem|Requiem]]’i verdi. 1896’da Paris Konservatuvarı’nda kompozisyon profesörü oldu; öğrencileri arasında Ravel ve Nadia Boulanger vardı.

      1905’te Konservatuvar’ın müdürü oldu ve okulu öyle kararlılıkla yeniledi ki eski kuşak ona “Robespierre” dedi. Aşağı yukarı bu sıralarda işitmesi yavaş yavaş zayıflamaya başladı; tiz ve pes notalar kulağına acı verecek kadar akortsuz geliyordu. Yine de en güzel eserlerinden bazılarını yazdı: *Pénélope* operası (1913), son şarkıları, piyano parçaları ve oda müziği; çoğunu İsviçre göllerinin kıyısındaki otellerde besteledi. 1920’de emekli oldu, 1922’de ulusal bir törenle onurlandırıldı ve tek yaylı çalgılar dörtlüsünü Eylül 1924’te bitirdi. 4 Kasım 1924’te, 79 yaşında Paris’te öldü ve La Madeleine’de devlet töreniyle uğurlandı. Aaron Copland ona “Fransa’nın Brahms’ı” demişti.
