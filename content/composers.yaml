- id: falla
  match: Manuel de Falla
  sort_name: Falla, Manuel de
  born: 1876
  birthday: "11-23"
  birthday_basis: null
  birthday_note:
    en: "In 1922 Falla organised a contest of *cante jondo*, the “deep song” of Andalusian flamenco, in the grounds of the Alhambra, hoping to save an art he feared was dying."
    tr: "Falla 1922’de Elhamra’nın bahçesinde, Endülüs flamenkosunun “derin şarkısı” *cante jondo* için bir yarışma düzenledi; yok olmakta olduğundan korktuğu bir sanatı kurtarmak istiyordu."
  birthday_line:
    en: "Born on this day in 1876, in Cádiz."
    tr: "1876’da bugün Cádiz’de doğdu."
  died: 1946
  era: modern
  names:
    en: { name: Manuel de Falla, short: Falla }
    tr: { name: Manuel de Falla, short: Falla, short_genitive: Falla’nın }
  nationality: { en: Spanish, tr: İspanyol }
  facts:
    born: { en: "23 November 1876, Cádiz", tr: "23 Kasım 1876, Cádiz" }
    died: { en: "14 November 1946, Alta Gracia, Argentina", tr: "14 Kasım 1946, Alta Gracia, Arjantin" }
    symphonies: { en: "None", tr: "Yok" }
    best_known_for: { en: "*Nights in the Gardens of Spain*, *El amor brujo*, *The Three-Cornered Hat*", tr: "*İspanya Bahçelerinde Geceler*, *El amor brujo*, *Üç Köşeli Şapka*" }
  bio:
    en: |-
      Falla was born in Cádiz, in the far south of Spain, in 1876. At the Madrid Conservatory he studied the piano with José Tragó and composition with Felipe Pedrell, who encouraged his interest in the music of Andalusia, above all flamenco and *cante jondo*, its "deep song". His one-act opera *La vida breve* won a national competition in 1905, but the promised production at the Teatro Real in Madrid never came.

      In 1907 he moved to Paris, where he stayed for seven years. There he came to know Debussy, Ravel, Paul Dukas, Stravinsky and the Spanish composer Isaac Albéniz, and *La vida breve* was finally staged, in Nice, in 1913. When the First World War broke out he returned to Madrid, and the next years brought his best-known works: the ballet with songs *El amor brujo* (1915), *Nights in the Gardens of Spain* (1916) and *The Three-Cornered Hat*, staged by Sergei Diaghilev's Ballets Russes with sets and costumes by Pablo Picasso.

      From 1921 he lived in Granada, below the Alhambra. In 1922, with the young poet Federico García Lorca, he organised a festival of *cante jondo* there to save the old songs, and his music grew leaner and more classical: the puppet opera *El retablo de maese Pedro* (1923) and a Harpsichord Concerto (1926). He spent his last twenty years on *Atlántida*, a vast cantata he never finished. After the Spanish Civil War he left for Argentina in 1939 and refused offers to come back. He died in Alta Gracia on 14 November 1946, nine days before his 70th birthday, and was buried in the crypt of Cádiz Cathedral.
    tr: |-
      Falla 1876’da İspanya’nın en güneyindeki Cádiz’de doğdu. Madrid Konservatuvarı’nda José Tragó’dan piyano, Felipe Pedrell’den kompozisyon dersi aldı; Pedrell onun Endülüs müziğine, özellikle flamenkoya ve “derin şarkı” *cante jondo*’ya ilgisini yüreklendirdi. Tek perdelik operası *La vida breve* 1905’te ulusal bir yarışmayı kazandı, ama Madrid’deki Teatro Real’de vaat edilen sahneleme hiç gerçekleşmedi.

      1907’de Paris’e taşındı ve orada yedi yıl kaldı. Debussy, Ravel, Paul Dukas, Stravinsky ve İspanyol besteci Isaac Albéniz ile tanıştı; *La vida breve* nihayet 1913’te Nice’te sahnelendi. Birinci Dünya Savaşı çıkınca Madrid’e döndü ve sonraki yıllar en tanınmış eserlerini getirdi: şarkılı bale *El amor brujo* (1915), *İspanya Bahçelerinde Geceler* (1916) ve Sergey Diyagilev’in Rus Baleleri tarafından, dekor ve kostümleri Pablo Picasso’ya ait olarak sahnelenen *Üç Köşeli Şapka*.

      1921’den itibaren Granada’da, Elhamra’nın eteklerinde yaşadı. 1922’de genç şair Federico García Lorca ile birlikte eski şarkıları kurtarmak için orada bir *cante jondo* festivali düzenledi; müziği de daha yalın ve daha klasik bir hal aldı: kukla operası *El retablo de maese Pedro* (1923) ve bir Klavsen Konçertosu (1926). Son yirmi yılını hiçbir zaman bitiremediği büyük bir kantat olan *Atlántida*’ya verdi. İspanya İç Savaşı’ndan sonra 1939’da Arjantin’e gitti ve geri dönme tekliflerini geri çevirdi. 14 Kasım 1946’da, 70. doğum gününden dokuz gün önce Alta Gracia’da öldü ve Cádiz Katedrali’nin mahzenine gömüldü.
