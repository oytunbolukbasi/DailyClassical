- id: bartok
  match: Béla Bartók
  sort_name: Bartók, Béla
  born: 1881
  birthday: "03-25"
  birthday_basis: null
  birthday_note:
    en: "In November 1936 Bartók travelled to southern Turkey to record folk songs. With Ahmed Adnan Saygun and two young Ankara teachers, Ulvi Cemal Erkin and Necil Kazım Akses, he went from village to village around Osmaniye."
    tr: "Bartók Kasım 1936’da halk ezgisi kaydetmek için Türkiye’nin güneyine gitti. Ahmed Adnan Saygun ve Ankara’dan iki genç öğretmen, Ulvi Cemal Erkin ile Necil Kâzım Akses ile birlikte Osmaniye çevresinde köy köy dolaştı."
  birthday_line:
    en: "Born on this day in 1881, in Nagyszentmiklós."
    tr: "1881’de bugün Nagyszentmiklós’ta doğdu."
  died: 1945
  era: modern
  names:
    en: { name: Béla Bartók, short: Bartók }
    tr: { name: Béla Bartók, short: Bartók, short_genitive: Bartók’un }
  nationality: { en: Hungarian, tr: Macar }
  facts:
    born: { en: "25 March 1881, Nagyszentmiklós, Hungary (now Sânnicolau Mare, Romania)", tr: "25 Mart 1881, Nagyszentmiklós, Macaristan (bugün Sânnicolau Mare, Romanya)" }
    died: { en: "26 September 1945, New York", tr: "26 Eylül 1945, New York" }
    symphonies: { en: "None numbered; the *Concerto for Orchestra* fills the role", tr: "Numaralı senfonisi yok; *Orkestra için Konçerto* bu yeri tutar" }
    best_known_for: { en: "*Concerto for Orchestra*, six string quartets, *Music for Strings, Percussion and Celesta*", tr: "*Orkestra için Konçerto*, altı yaylı dörtlü, *Yaylılar, Vurmalılar ve Çelesta için Müzik*" }
  bio:
    en: |-
      Bartók was born in 1881 in Nagyszentmiklós, then in Hungary and now in Romania. His father, the director of an agricultural school, died when he was seven, and his mother moved the family several times before settling in Pozsony (now Bratislava). He gave his first public recital at eleven and from 1899 to 1903 studied the piano and composition at the Academy of Music in Budapest, where he met Zoltán Kodály. His early works, such as the symphonic poem *Kossuth* (1903), were written in a late-Romantic style.

      In 1904 he heard a young woman, Lidi Dósa, singing folk songs, and soon he and Kodály were travelling from village to village, collecting Hungarian, Slovak and Romanian songs, many of them with a phonograph; later he collected in Algeria (1913) and Turkey (1936). The old peasant tunes, with their unusual modes and irregular rhythms, transformed his own music. From 1907 to 1934 he taught the piano at the Budapest Academy. He wrote the opera *Duke Bluebeard's Castle* (1911), the ballets *The Wooden Prince* and *The Miraculous Mandarin*, six string quartets, *Music for Strings, Percussion and Celesta* (1936) and *Mikrokosmos*, a cycle of piano pieces written partly for his son Péter.

      As Hungary drew closer to Nazi Germany, he emigrated to the United States in October 1940 with his second wife, the pianist Ditta Pásztory. Life there was hard: little money, few performances and, from 1943, the leukaemia that would kill him. A commission from Serge Koussevitzky led to the *Concerto for Orchestra* (1943), his most popular work. He died in New York on 26 September 1945, leaving his Third Piano Concerto almost finished and a Viola Concerto in sketches. In 1988 his remains were brought back to Budapest and reburied after a state funeral.
    tr: |-
      Bartók 1881’de, o zaman Macaristan’da, bugün Romanya’da bulunan Nagyszentmiklós’ta doğdu. Bir ziraat okulunun müdürü olan babası o yedi yaşındayken öldü; annesi aileyle birkaç kez taşındı ve sonunda Pozsony’ye (bugün Bratislava) yerleşti. On bir yaşında ilk konserini verdi; 1899–1903 arasında Budapeşte Müzik Akademisi’nde piyano ve kompozisyon okudu ve orada Zoltán Kodály ile tanıştı. Senfonik şiir *Kossuth* (1903) gibi ilk eserleri geç Romantik bir üslupla yazılmıştı.

      1904’te Lidi Dósa adlı genç bir kadının halk şarkıları söylediğini duydu; kısa süre sonra Kodály ile birlikte köy köy dolaşıp Macar, Slovak ve Rumen şarkıları derlemeye, bunların çoğunu fonografla kaydetmeye başladı. Daha sonra Cezayir’de (1913) ve Türkiye’de (1936) de derleme yaptı. Alışılmadık dizileri ve düzensiz ritimleriyle eski köylü ezgileri onun müziğini kökten değiştirdi. 1907’den 1934’e kadar Budapeşte Akademisi’nde piyano öğretti. *Mavi Sakal’ın Şatosu* operasını (1911), *Tahta Prens* ve *Mucizevi Mandarin* balelerini, altı yaylı dörtlüyü, *Yaylılar, Vurmalılar ve Çelesta için Müzik*’i (1936) ve bir kısmını oğlu Péter için yazdığı piyano parçaları dizisi *Mikrokosmos*’u yazdı.

      Macaristan Nazi Almanyası’na yaklaşırken, Ekim 1940’ta ikinci eşi piyanist Ditta Pásztory ile Amerika Birleşik Devletleri’ne göç etti. Oradaki hayat zordu: az para, az konser ve 1943’ten itibaren onu öldürecek olan lösemi. Serge Koussevitzky’nin bir siparişi, en sevilen eseri olan *Orkestra için Konçerto*’yu (1943) doğurdu. 26 Eylül 1945’te New York’ta öldü; Üçüncü Piyano Konçertosu neredeyse bitmiş, bir Viyola Konçertosu da taslak halinde kalmıştı. 1988’de naaşı Budapeşte’ye getirildi ve devlet töreniyle yeniden toprağa verildi.
