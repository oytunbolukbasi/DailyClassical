- id: handel
  match: George Frideric Handel
  sort_name: Handel, George Frideric
  born: 1685
  birthday: "02-23"
  birthday_basis: "old_style"
  birthday_note:
    en: "The public rehearsal of the *Music for the Royal Fireworks* in 1749 drew a crowd said to number twelve thousand and jammed London Bridge for hours. On the night itself, a pavilion caught fire."
    tr: "*Kraliyet Havai Fişekleri için Müzik*’in 1749’daki halka açık provası, on iki bin kişi olduğu söylenen bir kalabalık topladı ve London Bridge saatlerce tıkandı. Asıl gece ise bir köşk alev aldı."
  birthday_line:
    en: "Born on this day in 1685 (Old Style), in Halle."
    tr: "1685’te bugün (eski takvimle) Halle’de doğdu."
  died: 1759
  era: baroque
  names:
    en: { name: George Frideric Handel, short: Handel }
    tr: { name: Georg Friedrich Händel, short: Händel, short_genitive: Händel’in }
  nationality: { en: German-British, tr: Alman-İngiliz }
  facts:
    born: { en: "23 February 1685 (Old Style), Halle", tr: "23 Şubat 1685 (eski takvim), Halle" }
    died: { en: "14 April 1759, London", tr: "14 Nisan 1759, Londra" }
    symphonies: { en: "None (the form came after his time)", tr: "Yok (bu tür ondan sonra doğdu)" }
    best_known_for: { en: "*Messiah*, *Water Music*, *Music for the Royal Fireworks*", tr: "*Mesih*, *Su Müziği*, *Kraliyet Havai Fişekleri için Müzik*" }
  bio:
    en: |-
      Handel was born in Halle, in Saxony, in 1685, the same year as Bach. His father, a barber-surgeon who served the local court, wanted him to study law, and in 1702 he enrolled at the University of Halle, but music won. He went to Hamburg, played in the orchestra of its opera house and saw his first operas staged there in 1705. He then spent several years in Italy, writing operas and church music, before becoming music director to the Elector of Hanover in 1710.

      Within months he was in London, where his Italian opera *Rinaldo* was a great success in 1711, and in 1712 he settled there for good. When the Elector became King George I of Great Britain in 1714, Handel was already at home in London. His *Water Music* was played for the king on the Thames in 1717. For years he wrote and produced Italian operas for the London nobility, and in 1727 he became a British subject; in the same year he wrote *Zadok the Priest* for the coronation of George II, an anthem sung at every British coronation since.

      When Italian opera lost its public in the late 1730s, he turned to oratorios, dramatic works in English for soloists and chorus. *Messiah*, first performed in Dublin in 1742, became the most famous, and he gave it for years in aid of the Foundling Hospital, a London home for abandoned children. From 1752 he was blind. He died at his house in Brook Street in April 1759, a rich and respected man, and was given a state funeral in Westminster Abbey.
    tr: |-
      Händel 1685'te, Bach'la aynı yıl, Saksonya'daki Halle'de doğdu. Yerel saraya hizmet eden bir berber-cerrah olan babası onun hukuk okumasını istiyordu; 1702'de Halle Üniversitesi'ne yazıldı, ama müzik ağır bastı. Hamburg'a gitti, kentin opera binasının orkestrasında çaldı ve ilk operaları 1705'te orada sahnelendi. Ardından birkaç yıl İtalya'da opera ve kilise müziği yazdı; 1710'da Hannover Seçici Prensi'nin müzik yönetmeni oldu.

      Birkaç ay içinde Londra'ya gitti; İtalyanca operası *Rinaldo* 1711'de orada büyük başarı kazandı ve 1712'de kalıcı olarak İngiltere'ye yerleşti. Seçici Prens 1714'te Büyük Britanya Kralı I. George olduğunda Händel Londra'ya çoktan yerleşmişti. *Su Müziği* 1717'de Thames üzerinde kral için çalındı. Yıllarca Londra soyluları için İtalyanca operalar yazıp sahneledi; 1727'de İngiliz uyruğuna geçti. Aynı yıl II. George'un taç giyme töreni için *Zadok the Priest*'i yazdı; bu ilahi o günden beri her İngiliz taç giyme töreninde söylendi.

      İtalyan operası 1730'ların sonunda dinleyicisini yitirince oratoryolara, solistler ve koro için İngilizce dramatik eserlere yöneldi. İlk kez 1742'de Dublin'de seslendirilen *Mesih* bunların en ünlüsü oldu; Händel onu yıllarca Londra'da terk edilmiş çocuklara bakan Foundling Hospital yararına seslendirdi. 1752'den itibaren kördü. Nisan 1759'da Brook Street'teki evinde, zengin ve saygın biri olarak öldü; Westminster Abbey'de devlet töreniyle gömüldü.
