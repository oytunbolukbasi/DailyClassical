- id: mahler
  match: Gustav Mahler
  sort_name: Mahler, Gustav
  born: 1860
  died: 1911
  era: late_romantic
  names:
    en: { name: Gustav Mahler, short: Mahler }
    tr: { name: Gustav Mahler, short: Mahler }
  nationality: { en: Austrian, tr: Avusturyalı }
  facts:
    born: { en: "7 July 1860, Kaliště", tr: "7 Temmuz 1860, Kaliště" }
    died: { en: "18 May 1911, Vienna", tr: "18 Mayıs 1911, Viyana" }
    symphonies: { en: "Nine, plus an unfinished Tenth", tr: "Dokuz ve yarım kalmış bir Onuncu" }
    best_known_for: { en: "Symphonies, song cycles", tr: "Senfonileri, şarkı döngüleri" }
  bio:
    en: |-
      Mahler was born in 1860 in Kaliště, a village in Bohemia, into a German-speaking Jewish family, and grew up in the nearby town of Jihlava. Many of his parents' fourteen children died young, and death and loss echo all through his music. As a boy he loved folk songs and the military bands of the local barracks, sounds that later found their way into his symphonies. At fifteen he entered the Vienna Conservatory, where he studied piano and composition.

      He became one of the greatest conductors of his time. In 1897 he took charge of the Vienna Court Opera, having converted from Judaism to Catholicism shortly before, as the post effectively required. He was a fierce perfectionist, and his demand for fresh, meticulously rehearsed performances won him admirers and enemies in equal measure. For ten demanding years he transformed the company, and he composed in the summers, in small composing huts by lakes and in the mountains.

      Mahler is said to have told Sibelius that a symphony must be like the world: it must embrace everything. His symphonies are vast, mixing folk songs, marches, birdsong and moments of deep stillness. After leaving Vienna he conducted in New York, at the Metropolitan Opera and the New York Philharmonic. He died in Vienna in 1911, aged 50, leaving his Tenth Symphony unfinished.
    tr: |-
      Mahler 1860’ta Bohemya’daki Kaliště köyünde, Almanca konuşan Yahudi bir ailede doğdu ve yakındaki Jihlava kasabasında büyüdü. Anne babasının on dört çocuğundan birçoğu küçük yaşta öldü; ölüm ve kayıp, müziğinin her yerinde yankılanır. Çocukken halk şarkılarına ve yakındaki kışlanın bandosuna bayılırdı; bu sesler sonradan senfonilerine de girdi. On beş yaşında Viyana Konservatuvarı’na girdi ve orada piyano ve kompozisyon okudu.

      Döneminin en büyük orkestra şeflerinden biri oldu. 1897’de Viyana Saray Operası’nın başına geçti; bu görev neredeyse bunu şart koştuğu için kısa süre önce Yahudilikten Katolikliğe geçmişti. Tutkulu bir mükemmeliyetçiydi; titizlikle çalışılmış, taze yorumlarda ısrar etmesi ona hem hayranlar hem de düşmanlar kazandırdı. Operanın çehresini değiştirdiği on yorucu yıl boyunca beste yapmaya ancak yazları, göl kıyılarında ve dağlarda kurduğu küçük çalışma kulübelerinde vakit bulabildi.

      Mahler’in Sibelius’a, bir senfoninin dünya gibi olması, her şeyi kucaklaması gerektiğini söylediği anlatılır. Senfonileri devasa yapılardır; halk şarkılarını, marşları, kuş seslerini ve derin bir durgunluk anlarını bir araya getirir. Viyana’dan ayrıldıktan sonra New York’ta Metropolitan Operası’nda ve New York Filarmoni’de şeflik yaptı. 1911’de, 50 yaşında Viyana’da öldü; Onuncu Senfonisi yarım kaldı.
