- id: shostakovich
  match: Dmitri Shostakovich
  sort_name: Shostakovich, Dmitri
  born: 1906
  died: 1975
  era: modern
  names:
    en: { name: Dmitri Shostakovich, short: Shostakovich }
    tr: { name: Dmitri Şostakoviç, short: Şostakoviç }
  nationality: { en: Russian, tr: Rus }
  facts:
    born: { en: "25 September 1906, St Petersburg", tr: "25 Eylül 1906, St. Petersburg" }
    died: { en: "9 August 1975, Moscow", tr: "9 Ağustos 1975, Moskova" }
    symphonies: { en: "Fifteen", tr: "On beş" }
    best_known_for: { en: "Symphonies, string quartets", tr: "Senfonileri, yaylı dörtlüleri" }
  bio:
    en: |-
      Shostakovich was born in St Petersburg in 1906. After his father died, the teenager helped support the family by playing the piano in cinemas, accompanying silent films. He studied at the Petrograd Conservatory, and his First Symphony, written as a graduation piece when he was 19, made him famous almost overnight; within a few years it was being played in Berlin and in the United States.

      His life was bound up with Soviet politics. In 1936 the Communist Party newspaper *Pravda* attacked his opera *Lady Macbeth of the Mtsensk District* as "muddle instead of music", a dangerous charge at the height of Stalin's purges. He answered in 1937 with his Fifth Symphony, which was greeted with a long ovation. In 1948 he was denounced again, and for years he kept some of his most personal works in a drawer.

      During the Second World War his Seventh Symphony, the *Leningrad*, became a symbol of resistance; in 1942 it was even performed in the besieged city itself. He wrote fifteen symphonies and fifteen string quartets, music that can be savagely ironic one moment and desolate the next. People still argue about what his music was trying to say, which may be part of its power. He died in Moscow in 1975.
    tr: |-
      Şostakoviç 1906’da St. Petersburg’da doğdu. Babası öldükten sonra, daha gençken sinemalarda sessiz filmlere piyano eşliği yaparak ailesinin geçimine katkıda bulundu. Petrograd Konservatuvarı’nda okudu; on dokuz yaşında mezuniyet eseri olarak yazdığı Birinci Senfoni onu neredeyse bir gecede ünlü yaptı ve birkaç yıl içinde Berlin’de ve Amerika’da da çalındı.

      Hayatı Sovyet siyasetiyle iç içe geçti. 1936’da Komünist Parti’nin gazetesi *Pravda*, *Mtsensk İlçesinin Lady Macbeth’i* operasını “müzik yerine karmaşa” diye yerden yere vurdu; Stalin’in büyük temizliğinin tam ortasında bu tehlikeli bir suçlamaydı. Şostakoviç 1937’de Beşinci Senfonisi’yle yanıt verdi ve eser uzun bir alkışla karşılandı. 1948’de yeniden kınandı ve yıllarca en kişisel eserlerinden bazılarını çekmecede sakladı.

      İkinci Dünya Savaşı sırasında Yedinci Senfonisi, *Leningrad*, direnişin simgesi oldu; 1942’de kuşatma altındaki şehrin kendisinde bile seslendirildi. On beş senfoni ve on beş yaylı dörtlü yazdı: bir an acımasızca alaycı, bir sonraki an ıssız bir müzik. Müziğinin ne söylemek istediği bugün hâlâ tartışılıyor; belki de gücünün bir parçası buradan geliyor. 1975’te Moskova’da öldü.
