- id: stravinsky
  match: Igor Stravinsky
  sort_name: Stravinsky, Igor
  born: 1882
  birthday: "06-17"
  birthday_basis: null
  birthday_note:
    en: "*The Firebird* went to Stravinsky, then 27, after Diaghilev had first approached older composers, Anatoly Lyadov among them. The 1910 premiere made the young composer famous overnight."
    tr: "Diaghilev *Ateş Kuşu* için önce daha deneyimli bestecilere, aralarında Anatoli Lyadov’un da olduğu isimlere gitmişti; eser sonunda 27 yaşındaki Stravinski’ye kaldı. 1910’daki prömiyer genç besteciyi bir gecede ünlü yaptı."
  birthday_line:
    en: "Born on this day in 1882, in Oranienbaum."
    tr: "1882’de bugün Oranienbaum’da doğdu."
  died: 1971
  era: modern
  names:
    en: { name: Igor Stravinsky, short: Stravinsky }
    tr: { name: İgor Stravinski, short: Stravinski, short_genitive: Stravinski’nin }
  nationality: { en: Russian, tr: Rus }
  facts:
    born: { en: "17 June 1882, Oranienbaum (now Lomonosov), near St Petersburg", tr: "17 Haziran 1882, Oranienbaum (bugün Lomonosov), St. Petersburg yakınları" }
    died: { en: "6 April 1971, New York", tr: "6 Nisan 1971, New York" }
    symphonies: { en: "Four, including the *Symphony of Psalms*", tr: "Dört; *Mezmurlar Senfonisi* de aralarında" }
    best_known_for: { en: "*The Firebird*, *Petrushka*, *The Rite of Spring*", tr: "*Ateş Kuşu*, *Petruşka*, *Bahar Ayini*" }
  bio:
    en: |-
      Stravinsky was born in 1882 at Oranienbaum, on the Gulf of Finland near St Petersburg. His father, Fyodor, was a leading bass at the Mariinsky Theatre, and the boy grew up among singers, scores and the theatre. His parents wanted him to be a lawyer, and he studied law at St Petersburg University; but in 1902 he met Nikolai Rimsky-Korsakov, who became his teacher and mentor until his death in 1908. In 1906 Stravinsky married his cousin Yekaterina Nosenko.

      In 1909 the impresario Sergei Diaghilev heard two of his orchestral pieces, gave him some orchestrations to do and then, late that year, asked him to write *The Firebird* for the Ballets Russes. Its premiere in Paris in 1910 made him famous overnight. *Petrushka* followed in 1911, and in 1913 *The Rite of Spring*, whose violent rhythms and harsh dissonances caused a near-riot at its premiere. During the First World War he lived in Switzerland, drawing on Russian folk poetry; after the Revolution he never returned to live in Russia. In the 1920s, settled in France, he turned to the clarity of earlier music in works such as *Pulcinella* and the Octet, a style known as [[neoclassicism]]. He became a French citizen in 1934.

      In 1939, after the deaths of his wife, his daughter and his mother, he moved to the United States, where he married Vera de Bosset in 1940 and settled in Los Angeles; he became an American citizen in 1945. With his assistant Robert Craft he went on composing, conducting and recording his own music into old age, and in the 1950s, to general surprise, he adopted Schoenberg's twelve-note technique. He changed styles more than almost any other composer, yet his music is always recognisable by its sharp rhythms and clear, dry sound. He died in New York on 6 April 1971 and was buried in Venice, on the cemetery island of San Michele, near Diaghilev.
    tr: |-
      Stravinski 1882'de St. Petersburg yakınlarında, Fin Körfezi kıyısındaki Oranienbaum'da doğdu. Babası Fyodor, Mariinski Tiyatrosu'nun önde gelen baslarındandı; çocuk şarkıcıların, notaların ve tiyatronun arasında büyüdü. Ailesi onun avukat olmasını istiyordu, o da St. Petersburg Üniversitesi'nde hukuk okudu; ama 1902'de Nikolay Rimski-Korsakov ile tanıştı ve Rimski-Korsakov 1908'deki ölümüne dek hocası ve yol göstericisi oldu. 1906'da kuzeni Yekaterina Nosenko ile evlendi.

      1909'da impresaryo Sergey Diaghilev onun iki orkestra eserini dinledi, ona bazı orkestrasyon işleri verdi ve aynı yılın sonunda Rus Baleleri için *Ateş Kuşu*'nu yazmasını istedi. Eserin 1910'da Paris'teki ilk gösterimi onu bir gecede ünlü yaptı. Ardından 1911'de *Petruşka* ve 1913'te, sert ritimleri ve kaba uyumsuzluklarıyla ilk gösteriminde neredeyse bir ayaklanmaya yol açan *Bahar Ayini* geldi. Birinci Dünya Savaşı sırasında İsviçre'de yaşadı ve Rus halk şiirinden beslendi; Devrim'den sonra bir daha Rusya'ya yerleşmek üzere dönmedi. 1920'lerde Fransa'ya yerleşince *Pulcinella* ve Oktet gibi eserlerde eski müziğin berraklığına yöneldi; bu üsluba [[neoclassicism|neoklasisizm]] denir. 1934'te Fransız vatandaşı oldu.

      1939'da karısının, kızının ve annesinin ölümünden sonra Amerika Birleşik Devletleri'ne taşındı; 1940'ta Vera de Bosset ile evlendi ve Los Angeles'a yerleşti, 1945'te Amerikan vatandaşı oldu. Asistanı Robert Craft ile birlikte ileri yaşına dek beste yapmayı, kendi eserlerini yönetmeyi ve kaydetmeyi sürdürdü; 1950'lerde de herkesi şaşırtarak Schoenberg'in on iki ton tekniğini benimsedi. Üslubunu hemen her besteciden daha sık değiştirdi; yine de müziği keskin ritimleri ve berrak, kuru sesiyle her zaman tanınır. 6 Nisan 1971'de New York'ta öldü ve Venedik'te, San Michele mezarlık adasında, Diaghilev'in yakınına gömüldü.
