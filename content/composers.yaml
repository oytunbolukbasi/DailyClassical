- id: beethoven
  match: Ludwig van Beethoven
  sort_name: Beethoven, Ludwig van
  born: 1770
  died: 1827
  era: classical
  names:
    en: { name: Ludwig van Beethoven, short: Beethoven }
    tr: { name: Ludwig van Beethoven, short: Beethoven }
  nationality: { en: German, tr: Alman }
  facts:
    born: { en: "December 1770, Bonn", tr: "Aralık 1770, Bonn" }
    died: { en: "26 March 1827, Vienna", tr: "26 Mart 1827, Viyana" }
    symphonies: { en: "Nine", tr: "Dokuz" }
    best_known_for: { en: "Symphonies, piano sonatas, string quartets", tr: "Senfonileri, piyano sonatları, yaylı dörtlüleri" }
  bio:
    en: |-
      Beethoven grew up in Bonn, in a family of court musicians. His father, a singer, pushed him hard as a child prodigy, and in his teens Ludwig was already playing in the court orchestra and helping to support the family. In 1792 he moved to Vienna to study with Haydn, and he soon made his name there as a ferocious pianist, famous above all for his improvising.

      In his late twenties he began to lose his hearing. In 1802, in a letter to his brothers now known as the Heiligenstadt Testament, he admitted that he had thought of ending his life, and that only his art had held him back. What followed was a burst of bold, large-scale works, among them the *Eroica* and the Fifth Symphony. By his last years he was almost completely deaf, yet he kept composing, and wrote the Ninth Symphony and his late string quartets.

      Beethoven died in Vienna in 1827, and a huge crowd followed his funeral procession. He changed what people expected music to do: a symphony could now be a personal statement, a struggle that ends in triumph, or a deep meditation. He stretched old forms such as [[sonata form]] until they could hold far more drama than before. Almost every composer who came after him, from Brahms to Mahler, worked in his shadow.
    tr: |-
      Beethoven, Bonn’da saray müzisyenlerinden oluşan bir ailede büyüdü. Şarkıcı olan babası onu bir harika çocuk olarak yetiştirmek için çok zorladı; Ludwig daha gençlik yıllarında saray orkestrasında çalıyor ve ailesinin geçimine katkıda bulunuyordu. 1792’de Haydn’la çalışmak için Viyana’ya gitti ve orada kısa sürede, en çok da doğaçlamalarıyla ünlü, ateşli bir piyanist olarak tanındı.

      Yirmili yaşlarının sonunda işitmesini kaybetmeye başladı. 1802’de kardeşlerine yazdığı, bugün Heiligenstadt Vasiyeti olarak bilinen mektupta, canına kıymayı düşündüğünü ve onu yalnızca sanatının alıkoyduğunu itiraf etti. Ardından gelen yıllar, *Eroica* ve Beşinci Senfoni gibi cesur, büyük ölçekli eserlerle doldu. Son yıllarında neredeyse tamamen sağırdı; yine de bestelemeyi sürdürdü, Dokuzuncu Senfoni’yi ve son yaylı dörtlülerini yazdı.

      Beethoven 1827’de Viyana’da öldü; cenaze alayını büyük bir kalabalık izledi. Müziğin neler yapabileceğine dair beklentileri değiştirdi: Artık bir senfoni kişisel bir açıklama, zaferle biten bir mücadele ya da derin bir düşünceye dalış olabilirdi. [[sonata form|Sonat formu]] gibi eski kalıpları, eskisinden çok daha fazla dram taşıyabilecekleri hâle gelene dek genişletti. Ondan sonra gelen bestecilerin neredeyse hepsi, Brahms’tan Mahler’e, onun gölgesinde çalıştı.
  portrait:
