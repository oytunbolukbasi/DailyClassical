# Language-neutral composer facts + display names per locale.
# `match` is the exact `composer` value used in the piece yaml blocks.
#
# Composer sheet fields (SPEC §4.8), read by backend/scripts/seed.ts and export-fixtures.ts:
#   nationality   {en, tr} adjective shown in the meta line ("Russian" / "Rus").
#   facts         born / died / symphonies / best_known_for, each {en, tr}. Values may use *italics*.
#   bio           {en, tr}: exactly three paragraphs separated by a blank line. `[[term]]` marks a
#                 glossary term (EN key; TR uses `[[english key|türkçe yüzey]]`), *italics* for titles.
#   portrait      null when no safely public-domain image exists (the app then omits the portrait).
#     artist      string, or {en, tr} when it needs translating ("Unknown photographer").
#     title/collection  {en, tr}; collection may be null.
#     year        label string.
#     image_url   Wikimedia Commons Special:FilePath link (resolves to the original file; serve our
#                 own CDN copy before launch, as for paintings.yaml).
#     source_url  The Commons file page (licence template, provenance).
#     width/height  Pixel size of the original Commons file.
#     license     Licence of the image file.
#     license_url Licence deed URL; set for freely licensed (non-PD) images.
#     credit_line {en, tr}: required attribution text for non-PD images; the app shows it after the caption.
#     focal_y     0–1, vertical object-position for the 300 pt cover crop (CSS semantics: the share
#                 of the overflow cropped from the top), chosen so the face stays in frame.
#     hero/thumb/full, placeholder_color  Written by `npm run images` (backend/): our optimized HEIC copies in
#                 backend/public/images/composers/<id>-hero|thumb|full.heic and the image's average colour.
#                 After changing one image_url: `npm run images -- --only <composer id>` then `npm run fixtures`.
# Sources: content/research/composers-sources.md (checked 2026-10-04).

- id: mozart
  match: Wolfgang Amadeus Mozart
  sort_name: Mozart, Wolfgang Amadeus
  born: 1756
  died: 1791
  era: classical
  names:
    en: { name: Wolfgang Amadeus Mozart, short: Mozart }
    tr: { name: Wolfgang Amadeus Mozart, short: Mozart }
  nationality: { en: Austrian, tr: Avusturyalı }
  facts:
    born: { en: "27 January 1756, Salzburg", tr: "27 Ocak 1756, Salzburg" }
    died: { en: "5 December 1791, Vienna", tr: "5 Aralık 1791, Viyana" }
    symphonies: { en: "41 numbered", tr: "41 numaralı" }
    best_known_for: { en: "Operas, piano concertos, *Requiem*", tr: "Operaları, piyano konçertoları, *Requiem*" }
  bio:
    en: |-
      Mozart was born in Salzburg in 1756, the son of Leopold, a violinist and composer who was also a gifted teacher. Wolfgang was writing little pieces by the age of five, and as a child he toured the courts and concert halls of Europe with his father and his older sister, Nannerl, a brilliant keyboard player herself. Those years on the road filled his ears with every musical style of the day, from Italian opera to German counterpoint.

      In 1781 he broke with his employer, the Archbishop of Salzburg, and settled in Vienna as a freelance musician, a rare and risky move at the time. He earned his living by teaching, playing his own piano concertos at subscription concerts and selling his music. The Vienna years brought *The Marriage of Figaro*, *Don Giovanni* and *The Magic Flute*, and his last three symphonies, all written within a few weeks in the summer of 1788.

      He died in Vienna in December 1791, aged 35, with his *Requiem* unfinished; his pupil Franz Xaver Süssmayr completed it. What lasts is the feeling that nothing in his music is forced. Melodies that sound effortless turn out to be carefully built, and even the brightest pages can cloud over in a bar or two. That is why his music works on a first hearing and still rewards the hundredth.
    tr: |-
      Mozart 1756’da Salzburg’da doğdu. Babası Leopold hem kemancı ve besteciydi hem de çok iyi bir öğretmendi. Wolfgang beş yaşında küçük parçalar yazıyordu; çocukken babası ve kendisi de parlak bir klavye çalıcısı olan ablası Nannerl’le birlikte Avrupa’nın saraylarını ve konser salonlarını dolaştı. Yollarda geçen bu yıllar, kulağını İtalyan operasından Alman kontrpuanına kadar dönemin bütün müzik üsluplarıyla doldurdu.

      1781’de işvereni Salzburg Başpiskoposu’yla yollarını ayırdı ve Viyana’ya yerleşip serbest çalışan bir müzisyen oldu; o dönem için hem nadir hem de riskli bir karardı bu. Geçimini ders vererek, abonman konserlerinde kendi piyano konçertolarını çalarak ve eserlerini satarak sağladı. Viyana yılları *Figaro’nun Düğünü*, *Don Giovanni* ve *Sihirli Flüt*’ü, bir de 1788 yazında birkaç hafta içinde yazdığı son üç senfonisini getirdi.

      Aralık 1791’de, 35 yaşında Viyana’da öldü; *Requiem*’i yarım kalmıştı, eseri öğrencisi Franz Xaver Süssmayr tamamladı. Müziğinden geriye kalan duygu, hiçbir şeyin zorlanmadığıdır. Kendiliğinden doğmuş gibi duran melodiler aslında özenle kurulmuştur; en aydınlık sayfalar bile bir iki ölçü içinde gölgelenebilir. Bu yüzden Mozart ilk dinleyişte etkiler, yüzüncü dinleyişte de bir şeyler vermeyi sürdürür.
