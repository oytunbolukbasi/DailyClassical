- id: holst
  match: Gustav Holst
  sort_name: Holst, Gustav
  born: 1874
  birthday: "09-21"
  birthday_basis: null
  birthday_note:
    en: "Holst called astrology his “pet vice” and cast his friends’ horoscopes. *The Planets* grew out of that hobby: each movement is a planet’s character in astrology, not in astronomy."
    tr: "Holst astrolojiye “küçük kusurum” derdi ve dostlarının yıldız haritalarını çıkarırdı. *Gezegenler* bu merakın ürünüdür: her bölüm bir gezegenin gökbilimdeki değil, astrolojideki karakteridir."
  birthday_line:
    en: "Born on this day in 1874, in Cheltenham."
    tr: "1874’te bugün Cheltenham’da doğdu."
  died: 1934
  era: modern
  names:
    en: { name: Gustav Holst, short: Holst }
    tr: { name: Gustav Holst, short: Holst, short_genitive: Holst’un }
  nationality: { en: English, tr: İngiliz }
  facts:
    born: { en: "21 September 1874, Cheltenham", tr: "21 Eylül 1874, Cheltenham" }
    died: { en: "25 May 1934, London", tr: "25 Mayıs 1934, Londra" }
    symphonies: { en: "Two: the *Cotswolds* Symphony and the *Choral Symphony*", tr: "İki: *Cotswolds* Senfonisi ve *Koral Senfoni*" }
    best_known_for: { en: "*The Planets*, *St Paul’s Suite*, the carol tune for *In the Bleak Midwinter*", tr: "*Gezegenler*, *St Paul’s Süiti*, *In the Bleak Midwinter* ilahisinin ezgisi" }
  bio:
    en: |-
      Holst was born Gustavus Theodore von Holst in Cheltenham in 1874. His father's family, of Swedish, Latvian and German descent, had produced a professional musician in each of the three previous generations; his father, Adolph, was an organist, choirmaster and teacher. Holst hoped to become a pianist, but neuritis in his right arm stopped him, and he turned to composition. At the Royal College of Music he studied with Charles Villiers Stanford, and in 1895 he met Ralph Vaughan Williams, who became his lifelong friend and closest critic. To earn a living he played the trombone, as first trombone of the Carl Rosa Opera Company from 1898 and with the Scottish Orchestra.

      Teaching filled most of his life. From 1905 until his death he was director of music at St Paul's Girls' School in London, where a soundproof music room gave him a place to compose, and from 1907 to 1924 he led the music at Morley College, an evening college for working adults. He learned Sanskrit to make his own translations of Hindu texts for the chamber opera *Savitri* and the *Rig Veda* hymns, and the writer Clifford Bax introduced him to astrology, the starting point of *The Planets* (1914–16). In 1918 he dropped the "von" from his name and went to Salonica as a music organiser for the YMCA, working with soldiers waiting to go home.

      After the war *The Planets* made him internationally famous, a fame he found unwelcome and struggled against for the rest of his life. His later music grew sparer and more austere: *The Hymn of Jesus* (1917), the *Choral Symphony* and *Egdon Heath* (1927), a bleak picture of Thomas Hardy's moorland. His daughter Imogen, born in 1907, became a musician and his biographer. He died in London on 25 May 1934, aged 59, after an operation, and his ashes lie in Chichester Cathedral.
    tr: |-
      Holst 1874’te Cheltenham’da Gustavus Theodore von Holst adıyla doğdu. İsveç, Letonya ve Alman kökenli baba tarafı, kendisinden önceki üç kuşağın her birinde profesyonel bir müzisyen yetiştirmişti; babası Adolph orgcu, koro şefi ve öğretmendi. Holst piyanist olmak istiyordu ama sağ kolundaki nevrit buna engel oldu ve besteciliğe yöneldi. Kraliyet Müzik Koleji’nde Charles Villiers Stanford ile çalıştı; 1895’te ömür boyu dostu ve en yakın eleştirmeni olacak Ralph Vaughan Williams ile tanıştı. Geçimini trombon çalarak sağladı: 1898’den itibaren Carl Rosa Opera Topluluğu’nun birinci trombonu oldu, İskoç Orkestrası’nda da çaldı.

      Hayatının büyük bölümünü öğretmenlik doldurdu. 1905’ten ölümüne dek Londra’daki St Paul’s Kız Okulu’nun müzik direktörüydü; okuldaki ses yalıtımlı müzik odası ona beste yapacak bir yer verdi. 1907’den 1924’e kadar da çalışan yetişkinler için bir akşam okulu olan Morley College’ın müziğini yönetti. Oda operası *Savitri* ve *Rig Veda* ilahileri için Hint metinlerini kendisi çevirebilmek amacıyla Sanskritçe öğrendi; yazar Clifford Bax ise onu *Gezegenler*’in (1914–16) çıkış noktası olan astrolojiyle tanıştırdı. 1918’de adındaki “von”u bıraktı ve YMCA’nın müzik organizatörü olarak, eve dönmeyi bekleyen askerlerle çalışmak üzere Selanik’e gitti.

      Savaştan sonra *Gezegenler* onu uluslararası ölçekte ünlü yaptı; bu ünü istenmeyen bir yük olarak gördü ve ömrünün sonuna dek onunla boğuştu. Sonraki müziği daha yalın ve daha sert bir hal aldı: *İsa’nın İlahisi* (1917), *Koral Senfoni* ve Thomas Hardy’nin bozkırının kasvetli bir resmi olan *Egdon Heath* (1927). 1907’de doğan kızı Imogen müzisyen ve babasının biyografi yazarı oldu. Holst 25 Mayıs 1934’te, 59 yaşında, geçirdiği bir ameliyatın ardından Londra’da öldü; külleri Chichester Katedrali’nde yatıyor.
