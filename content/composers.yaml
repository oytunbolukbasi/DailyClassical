- id: brahms
  match: Johannes Brahms
  sort_name: Brahms, Johannes
  born: 1833
  died: 1897
  era: romantic
  names:
    en: { name: Johannes Brahms, short: Brahms }
    tr: { name: Johannes Brahms, short: Brahms }
  nationality: { en: German, tr: Alman }
  facts:
    born: { en: "7 May 1833, Hamburg", tr: "7 Mayıs 1833, Hamburg" }
    died: { en: "3 April 1897, Vienna", tr: "3 Nisan 1897, Viyana" }
    symphonies: { en: "Four", tr: "Dört" }
    best_known_for: { en: "*A German Requiem*, Hungarian Dances", tr: "*Bir Alman Requiem’i*, Macar Dansları" }
  bio:
    en: |-
      Brahms was born in Hamburg in 1833, the son of a double-bass player who scraped a living in the city's dance halls and theatres. Johannes was earning money at the piano while still a teenager. In 1853 he met Robert and Clara Schumann, and Robert, then one of the most respected composers in Germany, published an article hailing the twenty-year-old as the future of music.

      Schumann's praise was both a gift and a burden. Brahms worked on his First Symphony for about twenty years, all too aware of Beethoven looking over his shoulder, and it was finally premiered in 1876, when he was 43. After Robert Schumann's death he remained devoted to Clara for the rest of her life, as friend and confidant; the exact nature of their bond is still debated.

      He settled in Vienna in the 1860s and became one of the most admired figures in European music, writing four symphonies, *A German Requiem*, concertos, and a great deal of chamber music and songs. Brahms loved old forms such as the [[variation]] and the [[passacaglia]], and filled them with warm, autumnal feeling. He died in Vienna in 1897, less than a year after Clara.
    tr: |-
      Brahms 1833’te Hamburg’da doğdu; babası şehrin dans salonlarında ve tiyatrolarında kıt kanaat geçinen bir kontrbasçıydı. Johannes daha gençlik yıllarında piyano çalarak para kazanıyordu. 1853’te Robert ve Clara Schumann’la tanıştı; o sırada Almanya’nın en saygın bestecilerinden biri olan Robert, yirmi yaşındaki bu genci müziğin geleceği olarak selamlayan bir makale yayımladı.

      Schumann’ın övgüsü hem bir armağan hem de bir yüktü. Brahms, Beethoven’ın gölgesini hep omzunda hissederek Birinci Senfonisi üzerinde yaklaşık yirmi yıl çalıştı; eser sonunda 1876’da, o 43 yaşındayken ilk kez seslendirildi. Robert Schumann’ın ölümünden sonra Clara’ya hayatının sonuna kadar bir dost ve sırdaş olarak bağlı kaldı; aralarındaki bağın tam olarak ne olduğu bugün hâlâ tartışılıyor.

      1860’larda Viyana’ya yerleşti ve Avrupa müziğinin en saygın isimlerinden biri oldu: Dört senfoni, *Bir Alman Requiem’i*, konçertolar, çok sayıda oda müziği eseri ve şarkı yazdı. Brahms [[variation|varyasyon]] ve [[passacaglia|passacaglia]] gibi eski biçimleri severdi ve onları sıcak, sonbahar renkli bir duyguyla doldururdu. Clara’dan bir yıl bile geçmeden, 1897’de Viyana’da öldü.
