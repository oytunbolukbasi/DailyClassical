- id: tchaikovsky
  match: Pyotr Ilyich Tchaikovsky
  sort_name: Tchaikovsky, Pyotr Ilyich
  born: 1840
  died: 1893
  era: late_romantic
  names:
    en: { name: Pyotr Ilyich Tchaikovsky, short: Tchaikovsky }
    tr: { name: Pyotr İlyiç Çaykovski, short: Çaykovski }
  nationality: { en: Russian, tr: Rus }
  facts:
    born: { en: "7 May 1840, Votkinsk", tr: "7 Mayıs 1840, Votkinsk" }
    died: { en: "6 November 1893, St Petersburg", tr: "6 Kasım 1893, St. Petersburg" }
    symphonies: { en: "Six, plus *Manfred*", tr: "Altı ve *Manfred*" }
    best_known_for: { en: "Ballets, Piano Concerto No. 1", tr: "Baleleri, 1. Piyano Konçertosu" }
  bio:
    en: |-
      Tchaikovsky was born in 1840 in Votkinsk, a factory town in the Urals where his father managed the ironworks. His family steered him towards a safe career: he trained in law and worked as a clerk at the Ministry of Justice in St Petersburg. In his early twenties he began to study music seriously, and he was among the first students of the new St Petersburg Conservatory.

      In 1866 he moved to Moscow to teach harmony at the conservatory there. Success came gradually, with the First Piano Concerto, the ballet *Swan Lake* and the opera *Eugene Onegin*. A wealthy widow, Nadezhda von Meck, paid him an allowance for thirteen years that let him compose full time, on condition that they never meet. His brief marriage in 1877 was a disaster: Tchaikovsky was gay, at a time when that had to be hidden.

      By the 1880s he was the first Russian composer whose music was celebrated internationally, and he conducted his work in Leipzig, London and New York, where he took part in the opening of Carnegie Hall in 1891. He died in St Petersburg in 1893, nine days after conducting the premiere of his Sixth Symphony, the *Pathétique*. The official cause was cholera, and it is still argued over.
    tr: |-
      Çaykovski 1840’ta, babasının demir fabrikasını yönettiği Urallardaki bir sanayi kasabası olan Votkinsk’te doğdu. Ailesi onu güvenli bir mesleğe yönlendirdi: Hukuk okudu ve St. Petersburg’da Adalet Bakanlığı’nda memur olarak çalıştı. Yirmili yaşlarının başında müziği ciddi biçimde çalışmaya başladı ve yeni kurulan St. Petersburg Konservatuvarı’nın ilk öğrencileri arasına katıldı.

      1866’da oradaki konservatuvarda armoni öğretmek için Moskova’ya taşındı. Başarı yavaş yavaş geldi: Birinci Piyano Konçertosu, *Kuğu Gölü* balesi ve *Yevgeni Onegin* operası. Varlıklı bir dul olan Nadejda von Meck ona on üç yıl boyunca, tüm zamanını besteciliğe ayırmasını sağlayan bir maaş bağladı; tek koşul hiç yüz yüze görüşmemeleriydi. 1877’deki kısa evliliği bir felaketti: Çaykovski eşcinseldi ve bunu saklamak zorunda olduğu bir dönemde yaşıyordu.

      1880’lerde müziği uluslararası ölçekte kutlanan ilk Rus besteci olmuştu; eserlerini Leipzig’de, Londra’da ve New York’ta yönetti, 1891’de Carnegie Hall’un açılışında da yer aldı. 1893’te, Altıncı Senfonisi *Patetik*’in ilk seslendirilişini yönettikten dokuz gün sonra St. Petersburg’da öldü. Resmî ölüm nedeni koleraydı; konu bugün hâlâ tartışılıyor.
