- id: saint-saens
  match: Camille Saint-Saëns
  sort_name: Saint-Saëns, Camille
  born: 1835
  birthday: "10-09"
  birthday_basis: null
  birthday_note:
    en: "In *Danse macabre* Death plays a violin with its top string tuned down, so the open strings clash. The skeletons dance until a cockerel, played by the oboe, sends them back to their graves."
    tr: "*Danse macabre*’da Ölüm, en ince teli pese akort edilmiş bir keman çalar; boş teller birbiriyle çatışır. İskeletler, obuanın çaldığı horoz ötüp onları mezarlarına geri gönderene kadar dans eder."
  birthday_line:
    en: "Born on this day in 1835, in Paris."
    tr: "1835’te bugün Paris’te doğdu."
  died: 1921
  era: romantic
  names:
    en: { name: Camille Saint-Saëns, short: Saint-Saëns }
    tr: { name: Camille Saint-Saëns, short: Saint-Saëns, short_genitive: Saint-Saëns’ın }
  nationality: { en: French, tr: Fransız }
  facts:
    born: { en: "9 October 1835, Paris", tr: "9 Ekim 1835, Paris" }
    died: { en: "16 December 1921, Algiers", tr: "16 Aralık 1921, Cezayir" }
    symphonies: { en: "Five, three of them numbered", tr: "Beş; üçü numaralı" }
    best_known_for: { en: "*The Carnival of the Animals*, *Danse macabre*, *Samson and Delilah*", tr: "*Hayvanlar Karnavalı*, *Danse macabre*, *Samson ve Dalila*" }
  bio:
    en: |-
      Saint-Saëns was born in Paris in 1835. His father, an official at the Ministry of the Interior, died of tuberculosis when Camille was only a few months old, and the boy was brought up by his mother and her aunt, Charlotte Masson, who taught him the piano. Before he was three he showed perfect pitch, and at ten, in 1846, he made his official debut at the Salle Pleyel, playing concertos by Mozart and Beethoven. At thirteen he entered the Paris Conservatoire, where he studied the organ with François Benoist and composition with Fromental Halévy. He was just as gifted at school, and kept a lifelong amateur passion for astronomy.

      In 1853 he became organist of the church of Saint-Merri, and in 1858 of La Madeleine, the official church of the Empire; Liszt heard him there and called him the greatest organist in the world. From 1861 to 1865 he taught the piano at the École Niedermeyer, where his pupil Gabriel Fauré became a friend for life. In 1871, after the Franco-Prussian War, he helped to found the Société nationale de musique to promote new French music. He admired Liszt's [[symphonic poem]]s and wrote his own, among them *Danse macabre*, and it was through Liszt that his opera *Samson and Delilah* was first staged, at Weimar in 1877. His marriage of 1875 collapsed after both his young sons died in 1878; he left his wife in 1881.

      By the 1880s he was famous across Europe, especially in England, where the Philharmonic Society of London commissioned his "Organ" Symphony in 1886. That year he also finished *The Carnival of the Animals*, but forbade performances of it in his lifetime, fearing it would harm his name as a serious composer. He travelled constantly, wintered in Algiers and Egypt, and in 1908 wrote a score for the film *L'Assassinat du duc de Guise*. In old age he attacked Debussy and the new music of the 20th century, and came to be seen as a conservative. He died in Algiers in December 1921, aged 86, and was given a state funeral at the Madeleine. He once wrote that art exists to create beauty and character, and that feeling comes afterwards; Fauré and Fauré's pupil Ravel revered him as a genius.
    tr: |-
      Saint-Saëns 1835'te Paris'te doğdu. İçişleri Bakanlığı'nda memur olan babası, Camille daha birkaç aylıkken veremden öldü; çocuğu annesi ve annesinin teyzesi Charlotte Masson büyüttü, piyanoyu da ona Masson öğretti. Üç yaşına gelmeden mutlak kulağı olduğu anlaşıldı; on yaşında, 1846'da Salle Pleyel'de ilk resmî konserini verdi ve Mozart ile Beethoven'in konçertolarını çaldı. On üç yaşında Paris Konservatuvarı'na girdi; François Benoist'dan org, Fromental Halévy'den kompozisyon dersi aldı. Okulda da aynı ölçüde parlaktı; astronomiye ömrü boyunca amatör bir tutkuyla bağlı kaldı.

      1853'te Saint-Merri Kilisesi'nin, 1858'de de İmparatorluğun resmî kilisesi La Madeleine'in orgcusu oldu; Liszt onu orada dinleyince dünyanın en büyük orgcusu olduğunu söyledi. 1861'den 1865'e kadar École Niedermeyer'de piyano öğretti; öğrencisi Gabriel Fauré ömür boyu dostu olarak kaldı. 1871'de, Fransa-Prusya Savaşı'nın ardından, yeni Fransız müziğini tanıtmak için kurulan Société nationale de musique'in kurucuları arasında yer aldı. Liszt'in [[symphonic poem|senfonik şiirlerine]] hayrandı ve bu türde kendi eserlerini de yazdı; *Danse macabre* bunlardan biridir. *Samson ve Dalila* operası da ilk kez Liszt'in aracılığıyla, 1877'de Weimar'da sahnelendi. 1875'te yaptığı evlilik, iki küçük oğlunun 1878'de ölmesinden sonra dağıldı; 1881'de karısını bıraktı.

      1880'lerde bütün Avrupa'da, en çok da İngiltere'de ünlüydü; Londra Filarmoni Derneği 1886'da ondan "Org" Senfonisi'ni istedi. Aynı yıl *Hayvanlar Karnavalı*'nı da bitirdi, ama ciddi bir besteci olarak adına zarar vereceği kaygısıyla eserin sağlığında çalınmasını yasakladı. Durmadan yolculuk etti, kışları Cezayir'de ve Mısır'da geçirdi; 1908'de *L'Assassinat du duc de Guise* filmi için müzik yazdı. Yaşlılığında Debussy'ye ve 20. yüzyılın yeni müziğine saldırdı, tutucu biri olarak anılır oldu. Aralık 1921'de, 86 yaşında Cezayir'de öldü ve La Madeleine'de devlet töreniyle uğurlandı. Bir yazısında sanatın güzellik ve karakter yaratmak için var olduğunu, duygunun ise sonra geldiğini söylemişti; Fauré ve Fauré'nin öğrencisi Ravel onu bir dahi olarak sayarlardı.
