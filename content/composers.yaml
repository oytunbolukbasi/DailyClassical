- id: tallis
  match: Thomas Tallis
  sort_name: Tallis, Thomas
  born: 1505
  died: 1585
  era: renaissance
  names:
    en: { name: Thomas Tallis, short: Tallis }
    tr: { name: Thomas Tallis, short: Tallis }
  nationality: { en: English, tr: İngiliz }
  facts:
    born: { en: "c. 1505, probably Kent", tr: "y. 1505, büyük olasılıkla Kent" }
    died: { en: "November 1585, Greenwich", tr: "Kasım 1585, Greenwich" }
    symphonies: { en: "None (the form did not exist yet)", tr: "Yok (bu tür henüz ortada yoktu)" }
    best_known_for: { en: "*Spem in alium*, *Lamentations of Jeremiah*, English anthems", tr: "*Spem in alium*, *Yeremya'nın Ağıtları*, İngilizce ilahiler" }
  bio:
    en: |-
      Almost nothing is known about Tallis's early life. He was probably born in Kent around 1505, and the first record of him, from 1531, shows him as organist of the priory at Dover. He then worked at a London church and at Waltham Abbey in Essex until it was closed in 1540, when Henry VIII dissolved the monasteries, and after that sang at Canterbury Cathedral.

      From about 1543 he belonged to the Chapel Royal, the monarch's own choir, and he served four Tudor rulers in turn: Henry VIII, Edward VI, Mary I and Elizabeth I. As the official religion swung between Catholic and Protestant, he wrote Latin music for one reign and English music for the next, and seems to have stayed clear of the religious conflicts around him. He married around 1552 and lived in Greenwich.

      In 1575 Elizabeth gave Tallis and his former pupil William Byrd the sole right to print music in parts, and together they published a collection of Latin motets, *Cantiones sacrae*. Tallis died in Greenwich in November 1585, and Byrd wrote an elegy for him. No portrait made in his lifetime survives. His music, from short English anthems to the forty voices of *Spem in alium*, is still sung in churches and concert halls.
    tr: |-
      Tallis'in gençliği hakkında neredeyse hiçbir şey bilinmiyor. Büyük olasılıkla 1505 dolaylarında Kent'te doğdu; ondan söz eden ilk belge, 1531 tarihli, onu Dover'daki manastırın orgcusu olarak gösterir. Ardından Londra'da bir kilisede ve Essex'teki Waltham Manastırı'nda çalıştı; manastır, VIII. Henry'nin manastırları kapattığı 1540'ta kapanınca Canterbury Katedrali'nde şarkı söyledi.

      Yaklaşık 1543'ten itibaren hükümdarın kendi korosu olan Chapel Royal'in üyesiydi ve sırasıyla dört Tudor hükümdarına hizmet etti: VIII. Henry, VI. Edward, I. Mary ve I. Elizabeth. Resmî din Katoliklik ile Protestanlık arasında gidip gelirken o bir dönem için Latince, ardından gelen dönem için İngilizce müzik yazdı ve çevresindeki dinsel çatışmalardan uzak durmayı başarmış görünüyor. 1552 dolaylarında evlendi ve Greenwich'te yaşadı.

      1575'te Elizabeth, Tallis'e ve eski öğrencisi William Byrd'e çok sesli müzik basma tekelini verdi; ikisi birlikte Latince motetlerden oluşan *Cantiones sacrae* derlemesini yayımladı. Tallis Kasım 1585'te Greenwich'te öldü; Byrd onun için bir ağıt yazdı. Hayattayken yapılmış hiçbir portresi günümüze ulaşmadı. Kısa İngilizce ilahilerden *Spem in alium*'un kırk sesine kadar müziği bugün de kiliselerde ve konser salonlarında söyleniyor.
  portrait: null

- id: smetana
  match: Bedřich Smetana
  sort_name: Smetana, Bedřich
  born: 1824
  died: 1884
  era: romantic
  names:
    en: { name: Bedřich Smetana, short: Smetana }
    tr: { name: Bedřich Smetana, short: Smetana }
  nationality: { en: Czech, tr: Çek }
  facts:
    born: { en: "2 March 1824, Litomyšl", tr: "2 Mart 1824, Litomyšl" }
    died: { en: "12 May 1884, Prague", tr: "12 Mayıs 1884, Prag" }
    symphonies: { en: "One, the *Triumphal Symphony* (1853)", tr: "Bir, *Triumf Senfonisi* (1853)" }
    best_known_for: { en: "*Má vlast*, *The Bartered Bride*", tr: "*Má vlast* (Vatanım), *Satılmış Gelin*" }
  bio:
    en: |-
      Smetana was born in 1824 in Litomyšl, in Bohemia, then part of the Habsburg Empire, the son of a prosperous brewer. Like most educated Czechs of his day he grew up speaking German, and he learned to write good Czech only as an adult. He played in public at six, studied music in Prague, and in 1848 briefly joined the uprising there. Liszt, to whom he wrote for help that year, became a friend and supporter.

      Unable to make a living in Prague, he spent five years in Gothenburg, in Sweden, as a teacher and choirmaster, and returned in the early 1860s, when Czech culture was beginning to flourish. His comic opera *The Bartered Bride* (1866) became a great success, and he was made principal conductor of Prague's Provisional Theatre, the first home of Czech opera, although rivals attacked his music as too close to Wagner.

      In 1874 he went completely deaf and had to leave the theatre. In the years that followed he wrote some of his finest music, including *Má vlast*, a cycle of six orchestral pictures of his homeland, and the string quartet *From My Life*, in which a long, high note portrays the onset of his deafness. His health then broke down, and he died in a Prague asylum in 1884. In his own country he is regarded as the father of Czech music.
    tr: |-
      Smetana 1824'te, o sırada Habsburg İmparatorluğu'na bağlı olan Bohemya'da, Litomyšl'de, varlıklı bir bira üreticisinin oğlu olarak doğdu. Döneminin eğitimli Çeklerinin çoğu gibi Almanca konuşarak büyüdü; düzgün Çekçe yazmayı ancak yetişkinliğinde öğrendi. Altı yaşında halk önünde çaldı, Prag'da müzik eğitimi aldı ve 1848'de oradaki ayaklanmaya kısa bir süre katıldı. Aynı yıl yardım istemek için mektup yazdığı Liszt, onun dostu ve destekçisi oldu.

      Prag'da geçimini sağlayamayınca İsveç'te, Göteborg'da öğretmen ve koro şefi olarak beş yıl geçirdi; 1860'ların başında, Çek kültürünün filizlenmeye başladığı bir dönemde geri döndü. Komik operası *Satılmış Gelin* (1866) büyük başarı kazandı ve Çek operasının ilk yuvası olan Prag Geçici Tiyatrosu'nun baş şefliğine getirildi; ama rakipleri müziğini Wagner'e fazla yakın bulup ona saldırdı.

      1874'te tamamen sağır oldu ve tiyatrodan ayrılmak zorunda kaldı. Sonraki yıllarda en güzel eserlerinden bazılarını yazdı: vatanını anlatan altı orkestra tablosundan oluşan *Má vlast* döngüsü ve uzun, tiz bir notanın sağırlığının başlangıcını anlattığı *Hayatımdan* adlı yaylı dörtlüsü. Ardından sağlığı çöktü ve 1884'te Prag'da bir akıl hastanesinde öldü. Kendi ülkesinde Çek müziğinin babası sayılır.
