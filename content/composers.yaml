- id: prokofiev
  match: Sergei Prokofiev
  sort_name: Prokofiev, Sergei
  born: 1891
  birthday: "04-27"
  birthday_basis: null
  birthday_note:
    en: "Prokofiev celebrated on 23 April all life long. The birth certificate, found only after the composer’s death, says 27 April: four days later, and the day we keep."
    tr: "Prokofyev doğum gününü ömrü boyunca 23 Nisan’da kutladı. Ölümünden sonra bulunan doğum belgesinde ise 27 Nisan yazıyor: dört gün sonrası. Biz bu günü tutuyoruz."
  birthday_line:
    en: "Born on this day in 1891, in Sontsovka."
    tr: "1891’de bugün Sontsovka’da doğdu."
  died: 1953
  era: modern
  names:
    en: { name: Sergei Prokofiev, short: Prokofiev }
    tr: { name: Sergey Prokofyev, short: Prokofyev, short_genitive: Prokofyev’in }
  nationality: { en: Russian, tr: Rus }
  facts:
    born: { en: "27 April 1891, Sontsovka (now Ukraine)", tr: "27 Nisan 1891, Sontsovka (bugün Ukrayna)" }
    died: { en: "5 March 1953, Moscow", tr: "5 Mart 1953, Moskova" }
    symphonies: { en: "Seven", tr: "Yedi" }
    best_known_for: { en: "*Peter and the Wolf*, *Romeo and Juliet*, the *Classical* Symphony", tr: "*Peter ile Kurt*, *Romeo ve Juliet*, *Klasik* Senfoni" }
  bio:
    en: |-
      Prokofiev was born in 1891 on a country estate at Sontsovka, in what is now eastern Ukraine, where his father managed the land. His mother was a keen pianist, and he wrote his first piano piece at five and his first opera at nine. At thirteen he entered the St Petersburg Conservatory, where he was younger than most of his classmates and soon known as a rebel. His spiky, percussive piano music and his first two piano concertos caused scandals; he finished his studies in 1914 by winning the Conservatory's piano prize with his own First Concerto.

      In 1917, the year of the revolutions, he wrote his *Classical* Symphony and his First Violin Concerto. In 1918, with official permission, he left Russia and spent the next years abroad, first in the United States, where his opera *The Love for Three Oranges* was staged in Chicago in 1921, then in Paris, working for Diaghilev's Ballets Russes and touring as a pianist. In 1923 he married the Spanish singer Lina Codina; they had two sons.

      In 1936 he settled with his family in Moscow. That year he wrote *Peter and the Wolf*; his Soviet successes also included the ballet *Romeo and Juliet* and his music for Eisenstein's film *Alexander Nevsky* (1938). During the war he worked on the opera *War and Peace*. In 1948 the Soviet authorities condemned his music as "formalist", and the same year his former wife Lina was arrested and charged with espionage. He died in Moscow on 5 March 1953, on the same day as Stalin; the crowds mourning the dictator made it hard even to carry his coffin through the streets.
    tr: |-
      Prokofyev 1891’de, bugün Ukrayna’nın doğusunda kalan Sontsovka’da, babasının yönettiği bir çiftlikte doğdu. Annesi tutkulu bir piyanistti; Sergey ilk piyano parçasını beş yaşında, ilk operasını dokuz yaşında yazdı. On üç yaşında St. Petersburg Konservatuvarı’na girdi; sınıf arkadaşlarının çoğundan küçüktü ve kısa sürede asi biri olarak tanındı. Sivri, vurgulu piyano müziği ve ilk iki piyano konçertosu skandallara yol açtı; öğrenimini 1914’te, Konservatuvar’ın piyano ödülünü kendi Birinci Konçertosu’yla kazanarak bitirdi.

      Devrimlerin yılı olan 1917’de *Klasik* Senfoni’yi ve Birinci Keman Konçertosu’nu yazdı. 1918’de resmî izinle Rusya’dan ayrıldı ve sonraki yılları yurt dışında geçirdi: önce Amerika Birleşik Devletleri’nde, *Üç Portakala Aşk* operası 1921’de Chicago’da sahnelendi; sonra Paris’te, Diaghilev’in Rus Baleleri için çalıştı ve piyanist olarak turneler yaptı. 1923’te İspanyol şarkıcı Lina Codina ile evlendi; iki oğulları oldu.

      1936’da ailesiyle Moskova’ya yerleşti. Aynı yıl *Peter ile Kurt*’u yazdı; Sovyetler’deki başarıları arasında *Romeo ve Juliet* balesi ve Eisenstein’ın *Aleksandr Nevski* (1938) filminin müziği de vardı. Savaş yıllarında *Savaş ve Barış* operası üzerinde çalıştı. 1948’de Sovyet yönetimi müziğini “biçimci” diye kınadı; aynı yıl eski eşi Lina casusluk suçlamasıyla tutuklandı. 5 Mart 1953’te, Stalin’le aynı gün Moskova’da öldü; diktatörün yasını tutan kalabalıklar yüzünden tabutu sokaklardan güçlükle taşınabildi.
