- id: schubert
  match: Franz Schubert
  sort_name: Schubert, Franz
  born: 1797
  died: 1828
  era: romantic
  names:
    en: { name: Franz Schubert, short: Schubert }
    tr: { name: Franz Schubert, short: Schubert }
  nationality: { en: Austrian, tr: Avusturyalı }
  facts:
    born: { en: "31 January 1797, Vienna", tr: "31 Ocak 1797, Viyana" }
    died: { en: "19 November 1828, Vienna", tr: "19 Kasım 1828, Viyana" }
    symphonies: { en: "Seven complete, plus the *Unfinished*", tr: "Yedi tamamlanmış ve *Bitmemiş*" }
    best_known_for: { en: "Songs, chamber music, piano music", tr: "Şarkıları, oda müziği, piyano eserleri" }
  bio:
    en: |-
      Schubert was born in Vienna in 1797, the son of a schoolmaster. As a boy he sang in the choir of the imperial court chapel, which came with a place at a boarding school, where he played in the student orchestra and had lessons with Antonio Salieri. For a few years he taught at his father's school, but what he really did was write music, at an astonishing rate.

      He never held an important post, and he was never famous in the way Beethoven was, though they lived in the same city. Instead he had a devoted circle of friends, who gathered for evenings of his music that came to be called Schubertiades. He wrote more than 600 songs, among them *Erlkönig*, composed when he was 18, and the song cycle *Winterreise* ("Winter Journey").

      He fell seriously ill in his mid-twenties and died in 1828, aged just 31. Much of his greatest music, including the *Unfinished* Symphony and the *Great* C major Symphony, was only performed in public years after his death. His gift was melody, but also mood: in Schubert, a sudden change of key can feel like a cloud passing over the sun.
    tr: |-
      Schubert 1797’de Viyana’da, bir okul öğretmeninin oğlu olarak doğdu. Çocukken imparatorluk sarayının kilise korosunda şarkı söyledi; bu ona bir yatılı okulda yer kazandırdı. Orada öğrenci orkestrasında çaldı ve Antonio Salieri’den ders aldı. Birkaç yıl babasının okulunda öğretmenlik yaptı, ama asıl yaptığı şey müzik yazmaktı, hem de şaşırtıcı bir hızla.

      Hiçbir zaman önemli bir görevde bulunmadı; aynı şehirde yaşadığı Beethoven kadar ünlü de olmadı. Bunun yerine çevresinde ona gönülden bağlı bir dost grubu vardı; müziğini dinlemek için bir araya geldikleri akşamlara Schubertiade dendi. Altı yüzden fazla şarkı yazdı; aralarında on sekiz yaşında bestelediği *Erlkönig* ve şarkı döngüsü *Kış Yolculuğu* (*Winterreise*) da var.

      Yirmili yaşlarının ortasında ağır bir hastalığa yakalandı ve 1828’de, henüz 31 yaşındayken öldü. *Bitmemiş* Senfoni ve *Büyük* Do majör Senfoni de dahil en büyük eserlerinin çoğu, ancak ölümünden yıllar sonra halka seslendirildi. Yeteneği melodiydi, ama aynı zamanda ruh hâli: Schubert’te ani bir ton değişikliği, güneşin önünden geçen bir bulut gibi hissettirebilir.
