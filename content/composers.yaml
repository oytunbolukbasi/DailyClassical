- id: dvorak
  match: Antonín Dvořák
  sort_name: Dvořák, Antonín
  born: 1841
  died: 1904
  era: late_romantic
  names:
    en: { name: Antonín Dvořák, short: Dvořák }
    tr: { name: Antonín Dvořák, short: Dvořák }
  nationality: { en: Czech, tr: Çek }
  facts:
    born: { en: "8 September 1841, Nelahozeves", tr: "8 Eylül 1841, Nelahozeves" }
    died: { en: "1 May 1904, Prague", tr: "1 Mayıs 1904, Prag" }
    symphonies: { en: "Nine", tr: "Dokuz" }
    best_known_for: { en: "*New World* Symphony, Slavonic Dances", tr: "*Yeni Dünya* Senfonisi, Slav Dansları" }
  bio:
    en: |-
      Dvořák was born in 1841 in Nelahozeves, a village on the Vltava north of Prague, where his father was a butcher and innkeeper. He was expected to take over the family business, but music won. He studied at the organ school in Prague, then spent years playing the viola in a theatre orchestra, which for a time was conducted by Bedřich Smetana.

      Recognition came in his thirties. Brahms sat on the jury that awarded him an Austrian state grant, and he recommended Dvořák to his own publisher, Simrock, who brought out the *Slavonic Dances* in 1878 to huge success. Dvořák's music, full of the dance rhythms and melodies of Bohemia and Moravia, made him famous across Europe, and especially in England, which he visited nine times.

      In 1892 he went to New York as director of the National Conservatory of Music. There he wrote his Ninth Symphony, *From the New World*, and spent a summer among the Czech community of Spillville, Iowa. Homesick, he returned to Bohemia in 1895, later became director of the Prague Conservatory, and wrote his opera *Rusalka*. He died in Prague in 1904.
    tr: |-
      Dvořák 1841’de, Prag’ın kuzeyinde Vltava kıyısındaki Nelahozeves köyünde doğdu; babası kasap ve hancıydı. Aile işini devralması bekleniyordu, ama müzik ağır bastı. Prag’daki org okulunda okudu, ardından yıllarca bir tiyatro orkestrasında viyola çaldı; bu orkestrayı bir dönem Bedřich Smetana yönetti.

      Tanınması otuzlu yaşlarında geldi. Brahms, ona Avusturya devlet bursu veren jüride yer aldı ve Dvořák’ı kendi yayıncısı Simrock’a önerdi; Simrock 1878’de *Slav Dansları*’nı yayımladı ve eser büyük bir başarı kazandı. Bohemya ve Moravya’nın dans ritimleri ve ezgileriyle dolu müziği onu Avrupa’da, özellikle de dokuz kez ziyaret ettiği İngiltere’de ünlü yaptı.

      1892’de Ulusal Müzik Konservatuvarı’nın yöneticisi olarak New York’a gitti. Orada Dokuzuncu Senfonisi *Yeni Dünya’dan*’ı yazdı ve bir yazı Iowa’daki Spillville’de, Çek topluluğunun arasında geçirdi. Memleket hasretiyle 1895’te Bohemya’ya döndü, sonra Prag Konservatuvarı’nın yöneticisi oldu ve *Rusalka* operasını yazdı. 1904’te Prag’da öldü.
