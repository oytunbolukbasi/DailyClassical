- id: corelli
  match: Arcangelo Corelli
  sort_name: Corelli, Arcangelo
  born: 1653
  birthday: "02-17"
  birthday_basis: null
  birthday_note:
    en: "Corelli wanted a whole orchestra to bow as one, all up or all down. Francesco Geminiani, probably his pupil, said he would stop a rehearsal if he saw a single bow out of line."
    tr: "Corelli bütün orkestranın yayları tek bir kişi gibi, hep birlikte yukarı ya da aşağı çekmesini isterdi. Büyük olasılıkla öğrencisi olan Francesco Geminiani, tek bir yay bile ters gitse provayı durdurduğunu anlatır."
  birthday_line:
    en: "Born on this day in 1653, in Fusignano."
    tr: "1653’te bugün Fusignano’da doğdu."
  died: 1713
  era: baroque
  names:
    en: { name: Arcangelo Corelli, short: Corelli }
    tr: { name: Arcangelo Corelli, short: Corelli, short_genitive: Corelli’nin }
  nationality: { en: Italian, tr: İtalyan }
  facts:
    born: { en: "17 February 1653, Fusignano", tr: "17 Şubat 1653, Fusignano" }
    died: { en: "8 January 1713, Rome", tr: "8 Ocak 1713, Roma" }
    symphonies: { en: "None (the form came after his time)", tr: "Yok (bu tür ondan sonra doğdu)" }
    best_known_for: { en: "*Christmas Concerto*, concerti grossi Op. 6, violin sonatas Op. 5 (with *La Folia*)", tr: "*Noel Konçertosu*, Op. 6 concerti grossi, Op. 5 keman sonatları (*La Folia* ile)" }
  bio:
    en: |-
      Corelli was born in 1653 in Fusignano, a small town in Romagna, then part of the Papal States; his father had died five weeks before. He had his first music lessons in nearby towns and in 1666 moved to Bologna, a city with a famous school of violinists, and the title pages of his first three published collections still call him "il Bolognese". Many stories about his youth, such as a trip to Paris from which the jealous Lully is said to have chased him, are legends without contemporary evidence.

      By 1675 he was playing in Rome, which became his home. The city had no permanent orchestra, but its cardinals and princes staged lavish performances, and Corelli became the man who led them, sometimes with more than a hundred players. He directed music for Queen Christina of Sweden, worked for Cardinal Benedetto Pamphili and then for Cardinal Pietro Ottoboni, in whose palace he lived and led celebrated Monday concerts. He was admired as a violinist and as a strict leader who wanted every bow in the orchestra to move together.

      He published little: five sets of sonatas between 1681 and 1700, the last of them, Op. 5, ending with variations on *La Folia*, and the twelve concertos of Op. 6, each a [[concerto grosso]], which appeared in Amsterdam in 1714. They became models for a whole generation; Handel, Vivaldi, Bach and Couperin all learned from them, and Bach based an organ fugue on one of his themes. Corelli died in Rome on 8 January 1713, a wealthy man with a collection of paintings and fine violins, and was buried in the Pantheon.
    tr: |-
      Corelli 1653'te, o sırada Papalık Devleti'ne bağlı Romagna bölgesindeki küçük Fusignano kasabasında doğdu; babası doğumundan beş hafta önce ölmüştü. İlk müzik derslerini yakın kasabalarda aldı ve 1666'da, ünlü bir kemancılar okulu olan Bologna'ya taşındı; yayımlanan ilk üç derlemesinin başlık sayfaları onu hâlâ "il Bolognese" (Bolonyalı) diye anar. Gençliğine dair pek çok öykü, örneğin kıskanç Lully'nin onu Paris'ten kovduğu söylenen bir yolculuk, döneminden hiçbir kanıtı olmayan efsanelerdir.

      1675'e gelindiğinde Roma'da çalıyordu ve bu kent onun yurdu oldu. Roma'nın kalıcı bir orkestrası yoktu, ama kardinalleri ve prensleri görkemli gösteriler düzenliyordu; Corelli bunları yöneten kişi oldu, kimi zaman yüzü aşkın çalıcıyla. İsveç Kraliçesi Christina için müzik yönetti, önce Kardinal Benedetto Pamphili, sonra Kardinal Pietro Ottoboni için çalıştı; Ottoboni'nin sarayında yaşadı ve oradaki ünlü pazartesi konserlerini yönetti. Hem kemancı olarak hem de orkestradaki her yayın birlikte hareket etmesini isteyen titiz bir yönetici olarak hayranlık uyandırdı.

      Az yayımladı: 1681 ile 1700 arasında beş sonat derlemesi (sonuncusu olan Op. 5, *La Folia* üzerine varyasyonlarla biter) ve 1714'te Amsterdam'da çıkan on iki [[concerto grosso|concerto grosso]], Op. 6. Bunlar bütün bir kuşağa örnek oldu; Händel, Vivaldi, Bach ve Couperin onlardan öğrendi, Bach da onun temalarından birine dayanan bir org fügü yazdı. Corelli 8 Ocak 1713'te Roma'da, bir resim ve değerli keman koleksiyonuna sahip varlıklı bir adam olarak öldü ve Pantheon'a gömüldü.
