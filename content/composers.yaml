- id: respighi
  match: Ottorino Respighi
  sort_name: Respighi, Ottorino
  born: 1879
  birthday: "07-09"
  birthday_basis: null
  birthday_note:
    en: "In *Pines of Rome* Respighi asks for a gramophone record of a real nightingale, singing in the moonlit pines: one of the first uses of recorded sound in a concert work."
    tr: "Respighi *Roma’nın Çamları*’nda gerçek bir bülbülün plak kaydını ister; bülbül ay ışığındaki çamlarda öter. Bu, konser müziğinde kayıtlı sesin ilk kullanımlarından biridir."
  birthday_line:
    en: "Born on this day in 1879, in Bologna."
    tr: "1879’da bugün Bologna’da doğdu."
  died: 1936
  era: modern
  names:
    en: { name: Ottorino Respighi, short: Respighi }
    tr: { name: Ottorino Respighi, short: Respighi, short_genitive: Respighi’nin }
  nationality: { en: Italian, tr: İtalyan }
  facts:
    born: { en: "9 July 1879, Bologna", tr: "9 Temmuz 1879, Bologna" }
    died: { en: "18 April 1936, Rome", tr: "18 Nisan 1936, Roma" }
    symphonies: { en: "One, the *Sinfonia drammatica* (1914)", tr: "Bir: *Sinfonia drammatica* (1914)" }
    best_known_for: { en: "*Fountains of Rome*, *Pines of Rome*, *Roman Festivals*, *Ancient Airs and Dances*", tr: "*Roma'nın Çeşmeleri*, *Roma'nın Çamları*, *Roma Şenlikleri*, *Eski Havalar ve Danslar*" }
  bio:
    en: |-
      Respighi was born in Bologna in 1879. His father, a post-office worker, was a fine pianist who taught music, and gave the boy his first lessons on the piano and the violin. At twelve he entered the Liceo Musicale of Bologna, where he studied violin, viola and composition; he took his violin diploma in 1899. The following winter he went to St Petersburg as principal viola of the Imperial opera orchestra, and there he took lessons in orchestration from Rimsky-Korsakov, whose brilliant use of the orchestra shaped his own. When he finished his composition studies in 1901, his teacher Giuseppe Martucci said: "Respighi is not a pupil, Respighi is a master." He was a voracious reader and came to read literature in eleven languages.

      For the next decade he earned his living mainly as a violinist and viola player in Bologna, while composing songs and operas and arranging forgotten Italian music of the 17th and 18th centuries, a lifelong passion. In 1913 he moved to Rome as professor of composition at the Liceo Musicale di Santa Cecilia. One of his pupils was the singer Elsa Olivieri-Sangiacomo; they married in 1919, and she became his closest companion and, after his death, the keeper of his music. *Fountains of Rome* was coolly received at its premiere in 1917, but in 1918 Toscanini conducted it in Milan and it made Respighi famous. His suites *Ancient Airs and Dances*, freely arranged from old lute pieces, and the ballet *La Boutique fantasque*, made from piano pieces by Rossini for Diaghilev's Ballets Russes, followed.

      In 1923 he became the first director of the Conservatorio di Santa Cecilia, but he disliked the paperwork and resigned in 1926, while still teaching composition until 1935. *Pines of Rome* (1924) and *Roman Festivals* (1928) completed his Roman trilogy, and from 1925 he toured the United States and South America as conductor and pianist in his own music. He kept a cautious distance from Mussolini's regime, which nevertheless honoured him and used his music. At the end of 1935, while writing the opera *Lucrezia*, he fell ill with an infection of the heart that could not then be cured, and he died in Rome on 18 April 1936, aged 56. Elsa outlived him by almost sixty years.
    tr: |-
      Respighi 1879'da Bologna'da doğdu. Postanede çalışan babası usta bir piyanistti, müzik dersleri de veriyordu; oğluna ilk piyano ve keman derslerini o verdi. On iki yaşında Bologna Liceo Musicale'ye girdi; keman, viyola ve kompozisyon okudu, 1899'da keman diplomasını aldı. Ertesi kış St. Petersburg'a, İmparatorluk opera orkestrasına başviyolacı olarak gitti; orada, orkestrayı parlak biçimde kullanışı onun da üslubunu biçimlendirecek olan Rimski-Korsakov'dan orkestrasyon dersleri aldı. 1901'de kompozisyon öğrenimini bitirdiğinde hocası Giuseppe Martucci, "Respighi bir öğrenci değil, bir ustadır" dedi. Doymak bilmez bir okurdu; zamanla on bir dilde edebiyat okuyabilir hâle geldi.

      Sonraki on yıl boyunca geçimini çoğunlukla Bologna'da kemancı ve viyolacı olarak sağladı; bir yandan şarkılar ve operalar besteledi, bir yandan da ömür boyu tutkusu olacak unutulmuş 17. ve 18. yüzyıl İtalyan müziğini düzenledi. 1913'te Liceo Musicale di Santa Cecilia'da kompozisyon profesörü olarak Roma'ya taşındı. Öğrencilerinden biri şarkıcı Elsa Olivieri-Sangiacomo'ydu; 1919'da evlendiler. Elsa onun en yakın yol arkadaşı, ölümünden sonra da müziğinin bekçisi oldu. *Roma'nın Çeşmeleri* 1917'deki ilk seslendirilişinde soğuk karşılandı; ama 1918'de Toscanini eseri Milano'da yönetti ve Respighi'yi ünlü yaptı. Ardından eski lavta parçalarından serbestçe düzenlediği *Eski Havalar ve Danslar* süitleri ve Diaghilev'in Rus Baleleri için Rossini'nin piyano parçalarından yaptığı *La Boutique fantasque* balesi geldi.

      1923'te Conservatorio di Santa Cecilia'nın ilk müdürü oldu; ama yazışmalardan ve evrak işlerinden hoşlanmadı, 1926'da istifa etti, kompozisyon derslerini ise 1935'e kadar sürdürdü. *Roma'nın Çamları* (1924) ve *Roma Şenlikleri* (1928) Roma üçlemesini tamamladı; 1925'ten itibaren Amerika Birleşik Devletleri'nde ve Güney Amerika'da kendi eserlerini şef ve piyanist olarak seslendirdiği turnelere çıktı. Mussolini rejimine temkinli bir mesafede durdu; rejim yine de onu onurlandırdı ve müziğini kullandı. 1935'in sonunda, *Lucrezia* operası üzerinde çalışırken o dönemde tedavisi olmayan bir kalp enfeksiyonuna yakalandı ve 18 Nisan 1936'da, 56 yaşında Roma'da öldü. Elsa ondan neredeyse altmış yıl fazla yaşadı.
