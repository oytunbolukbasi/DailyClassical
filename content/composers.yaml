- id: bizet
  match: Georges Bizet
  sort_name: Bizet, Georges
  born: 1838
  birthday: "10-25"
  birthday_basis: null
  birthday_note:
    en: "The Habanera in *Carmen* borrows a tune by the Spanish composer Sebastián Yradier. Bizet took it for a folk song, and added a credit to the score once the truth came out."
    tr: "*Carmen*’deki Habanera, İspanyol besteci Sebastián Yradier’in bir ezgisinden ödünç alınmıştır. Bizet onu bir halk şarkısı sanmış, gerçeği öğrenince partisyona Yradier’in adını eklemişti."
  birthday_line:
    en: "Born on this day in 1838, in Paris."
    tr: "1838’de bugün Paris’te doğdu."
  died: 1875
  era: romantic
  names:
    en: { name: Georges Bizet, short: Bizet }
    tr: { name: Georges Bizet, short: Bizet, short_genitive: Bizet’nin }
  nationality: { en: French, tr: Fransız }
  facts:
    born: { en: "25 October 1838, Paris", tr: "25 Ekim 1838, Paris" }
    died: { en: "3 June 1875, Bougival, near Paris", tr: "3 Haziran 1875, Bougival, Paris yakınları" }
    symphonies: { en: "One, the Symphony in C, and the symphony *Roma*", tr: "Bir, Do Majör Senfoni; bir de *Roma* senfonisi" }
    best_known_for: { en: "*Carmen*, *L'Arlésienne*, *The Pearl Fishers*", tr: "*Carmen*, *L'Arlésienne*, *İnci Avcıları*" }
  bio:
    en: |-
      Bizet was born in Paris in 1838. He was registered as Alexandre César Léopold but baptised Georges, the name he kept. His father, a former wigmaker, had become a singing teacher, and his mother was a fine pianist. The boy was so gifted that the Paris Conservatoire took him at nine, below the official age. He won first prize for piano, studied composition with Fromental Halévy and became a friend of the young Camille Saint-Saëns. At seventeen he wrote a Symphony in C full of youthful sparkle, but never published it; it was found again in 1933 and first played in 1935.

      In 1857 he won the Prix de Rome and spent nearly three years at the Villa Medici in Rome. Back in Paris, success would not come. The opera houses preferred established names, and he earned his living largely by arranging other composers' music. Neither *The Pearl Fishers* (1863) nor *The Fair Maid of Perth* (1867) succeeded at first. In 1869 he married Geneviève Halévy, his late teacher's daughter; their only son, Jacques, was born in 1872. That year his music for Alphonse Daudet's play *L'Arlésienne* failed in the theatre, but the concert suite he made from it was an immediate success.

      His last opera, *Carmen*, opened at the Opéra-Comique on 3 March 1875, the day his appointment to the Legion of Honour was announced. Its realism and its heroine, who lives and dies by her own rules, shocked the audience, and Bizet believed it had failed. Three months later, on 3 June 1875, his sixth wedding anniversary, he died of a heart attack at Bougival, near Paris, aged 36. Within a few years *Carmen* was being performed all over the world, and it is now one of the most popular operas ever written.
    tr: |-
      Bizet 1838'de Paris'te doğdu. Nüfusa Alexandre César Léopold adıyla yazıldı, ama Georges adıyla vaftiz edildi ve hep bu adı kullandı. Eskiden perukçu olan babası şan öğretmenliğine geçmişti; annesi iyi bir piyanistti. Çocuk o kadar yetenekliydi ki Paris Konservatuvarı onu resmî yaşın altında, dokuz yaşında kabul etti. Piyanoda birincilik ödülü kazandı, Fromental Halévy'den kompozisyon dersi aldı ve genç Camille Saint-Saëns ile dost oldu. On yedi yaşında gençlik ışıltısıyla dolu bir Do Majör Senfoni yazdı ama onu hiç yayımlamadı; senfoni 1933'te yeniden bulundu ve ilk kez 1935'te çalındı.

      1857'de Roma Ödülü'nü kazandı ve neredeyse üç yılını Roma'da, Villa Medici'de geçirdi. Paris'e döndüğünde başarı bir türlü gelmedi. Opera binaları tanınmış isimleri yeğliyordu; Bizet geçimini büyük ölçüde başka bestecilerin müziğini düzenleyerek sağladı. Ne *İnci Avcıları* (1863) ne de *Perth'in Güzel Kızı* (1867) ilk başta başarılı oldu. 1869'da ölen hocasının kızı Geneviève Halévy ile evlendi; tek çocukları Jacques 1872'de doğdu. Aynı yıl Alphonse Daudet'nin *L'Arlésienne* oyunu için yazdığı müzik tiyatroda başarısız oldu, ama ondan çıkardığı konser süiti hemen beğenildi.

      Son operası *Carmen*, 3 Mart 1875'te, Legion d'honneur nişanına layık görüldüğünün duyurulduğu gün Opéra-Comique'te sahnelendi. Gerçekçiliği ve kendi kurallarıyla yaşayıp ölen kadın kahramanı seyirciyi sarstı; Bizet operanın başarısız olduğuna inandı. Üç ay sonra, 3 Haziran 1875'te, altıncı evlilik yıldönümünde, Paris yakınlarındaki Bougival'de kalp krizinden öldü; 36 yaşındaydı. Birkaç yıl içinde *Carmen* bütün dünyada sahneleniyordu; bugün yazılmış en sevilen operalardan biridir.
